#stepup-crew-preview .su-ready{font-size:12px;color:#73efcd;display:flex;align-items:center;gap:4px}
#stepup-crew-preview .su-ready svg{width:13px!important;height:13px!important}
#stepup-crew-preview .su-waiting{font-size:12px;color:var(--su-muted)}
#stepup-crew-preview .su-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
#stepup-crew-preview .su-switch{appearance:none;-webkit-appearance:none;width:41px;height:24px;background:#39536a;border-radius:20px;position:relative;margin:0;flex:0 0 41px;cursor:pointer}
#stepup-crew-preview .su-switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#e6f0ff;left:3px;top:3px;transition:transform .15s}
#stepup-crew-preview .su-switch:checked{background:var(--su-blue)}
#stepup-crew-preview .su-switch:checked:after{transform:translateX(17px)}
#stepup-crew-preview .su-notice{padding:12px 13px;background:#123951;border-radius:11px;display:flex;align-items:flex-start;gap:8px;color:#c9def2;font-size:12px;line-height:1.65}
#stepup-crew-preview .su-notice svg{width:17px!important;height:17px!important;flex-shrink:0;margin-top:2px}
#stepup-crew-preview .su-notice.warning{background:#3b3027;color:#ffcf9b}
#stepup-crew-preview .su-textaction{border:0;background:transparent;color:#a8c8ff;padding:11px 0;font-size:12px;display:flex;gap:5px;align-items:center}
#stepup-crew-preview .su-textaction svg{width:14px!important;height:14px!important}
#stepup-crew-preview .su-map{position:relative;background:#0b3558;overflow:hidden;height:322px;width:100%;isolation:isolate}
#stepup-crew-preview .su-map.small{height:180px;border-radius:12px}
#stepup-crew-preview .su-map.mini{height:138px;border-radius:12px}
#stepup-crew-preview .su-map-tiles{position:absolute;left:0;right:0;top:50%;aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;transform:translateY(-50%) scale(1.07);filter:grayscale(1) invert(1) brightness(.58) contrast(1.2)}
#stepup-crew-preview .su-map-tiles img{width:100%;height:100%;object-fit:cover;display:block}
#stepup-crew-preview .su-map:after{content:"";position:absolute;inset:0;background:#063e70;opacity:.38;pointer-events:none}
#stepup-crew-preview .su-route{position:absolute;inset:0;width:100%;height:100%;z-index:2}
#stepup-crew-preview .su-map .su-map-label{position:absolute;z-index:3;left:16px;top:14px;font-size:11px;background:#05213be8;padding:6px 10px;border-radius:15px;color:#c3def5}
#stepup-crew-preview .su-map-person{position:absolute;transform:translate(-50%,-50%);z-index:4;width:29px;height:29px;border:2px solid white;border-radius:50%;background:#203e60;color:white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
#stepup-crew-preview .su-map-person.my{width:32px;height:32px;background:var(--su-blue)}
#stepup-crew-preview .su-map-person svg{width:17px!important;height:17px!important}
#stepup-crew-preview .su-map-credit{position:absolute;bottom:5px;left:7px;z-index:4;font-size:9px;color:#e0ecf7;background:#05213bd9;padding:2px 4px;letter-spacing:0}
#stepup-crew-preview .su-recenter{position:absolute;bottom:19px;right:14px;z-index:4;border:1px solid #567395;border-radius:50%;background:#05213bea;color:white;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
#stepup-crew-preview .su-recenter svg{width:19px!important;height:19px!important}
#stepup-crew-preview .su-roster{display:flex;justify-content:space-between;gap:7px;padding:17px 18px 6px;background:transparent;border:0;color:var(--su-text);width:100%}
#stepup-crew-preview .su-roster-person{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--su-label);min-width:0}
#stepup-crew-preview .su-roster .su-avatar{width:43px;height:43px;font-size:12px}
#stepup-crew-preview .su-stats{display:grid;grid-template-columns:1.04fr 1fr 1fr;padding:15px 20px 12px;gap:12px}
#stepup-crew-preview .su-stat+.su-stat{border-left:1px solid #426381;padding-left:12px}
#stepup-crew-preview .su-stat-label{font-size:12px;color:var(--su-label);margin-bottom:4px}
#stepup-crew-preview .su-value{font-size:28px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.065em;white-space:nowrap}
#stepup-crew-preview .su-unit{font-size:11px;color:var(--su-label);font-weight:500;letter-spacing:0;margin-left:3px}
#stepup-crew-preview .su-run-progress{padding:9px 21px 7px;font-size:12px;color:var(--su-label)}
#stepup-crew-preview .su-progress{height:9px;background:#123e64;border-radius:10px;overflow:hidden;margin-top:10px}
#stepup-crew-preview .su-progress-fill{height:100%;width:65%;background:var(--su-cyan);border-radius:10px}
#stepup-crew-preview .su-reward{font-size:11px;color:var(--su-label);padding:12px 21px 0}
#stepup-crew-preview .su-run-footer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#stepup-crew-preview .su-run-footer button{min-height:58px;font-size:17px}
#stepup-crew-preview .su-stop{display:inline-block;width:15px;height:15px;background:var(--su-red);border-radius:3px}
#stepup-crew-preview .su-pause-band{background:#143d5e;color:#d0e5f5;font-size:12px;padding:8px 21px;display:flex;gap:7px;align-items:center}
#stepup-crew-preview .su-pause-band svg{width:15px!important;height:15px!important}
#stepup-crew-preview .su-modal-overlay{position:absolute;inset:0;background:#00101f9c;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;padding-top:60px}
#stepup-crew-preview .su-sheet{background:#092a47;border:1px solid #30516f;border-bottom:0;border-radius:24px 24px 0 0;padding:10px 22px 26px;max-height:100%;box-shadow:0 -15px 40px #00101f30}
#stepup-crew-preview .su-sheet-handle{height:4px;width:34px;background:#567189;border-radius:5px;margin:0 auto 18px}
#stepup-crew-preview .su-sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
#stepup-crew-preview .su-sheet-title{font-size:21px;font-weight:750;line-height:1.4;margin:4px 0}
#stepup-crew-preview .su-sheet .su-footer{padding:16px 0 0}
#stepup-crew-preview .su-sheet .su-stats{padding:14px 0}
#stepup-crew-preview .su-sheet .su-members{padding:0 11px}
#stepup-crew-preview .su-sheet .su-member{min-height:56px}
#stepup-crew-preview .su-option{width:100%;border:1px solid var(--su-line);border-radius:13px;background:var(--su-card);padding:15px;color:var(--su-text);text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:10px}
#stepup-crew-preview .su-option.selected{border-color:#4d86ff;background:#103968}
#stepup-crew-preview .su-radio{height:19px;width:19px;border-radius:50%;border:2px solid #57708e;margin-left:auto;flex-shrink:0}
#stepup-crew-preview .su-option.selected .su-radio{border:5px solid #5390ff;background:white}
#stepup-crew-preview .su-ready-count{display:flex;justify-content:space-around;text-align:center;padding:20px 0}
#stepup-crew-preview .su-ready-count strong{display:block;font-size:38px;font-weight:750;margin-bottom:3px;letter-spacing:-.06em}
#stepup-crew-preview .su-countdown{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:25px 20px;text-align:center}
#stepup-crew-preview .su-countdown .su-digit{font-size:170px;line-height:1.15;font-weight:800;color:var(--su-text);font-variant-numeric:tabular-nums;letter-spacing:-.08em;margin:15px 0 20px}
#stepup-crew-preview .su-countdown h3{font-size:25px;font-weight:750;margin:15px 0 0}
#stepup-crew-preview .su-countdown p{font-size:14px;color:var(--su-label);margin:6px 0 12px}
#stepup-crew-preview .su-countdown-people{display:flex;gap:7px;justify-content:center;margin-bottom:22px}
#stepup-crew-preview .su-empty-icon{height:92px;width:92px;background:#113858;color:#8ebcff;border-radius:28px;display:flex;align-items:center;justify-content:center;margin:32px auto 24px}
#stepup-crew-preview .su-empty-icon svg{height:45px!important;width:45px!important}
#stepup-crew-preview .su-result-distance{font-size:68px;line-height:1.15;font-weight:750;letter-spacing:-.07em;margin:10px 0 16px}
#stepup-crew-preview .su-result-distance span{font-size:22px;color:var(--su-label);font-weight:500;letter-spacing:-.03em}
#stepup-crew-preview .su-result-info{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#stepup-crew-preview .su-result-info strong{font-size:24px;font-weight:650}
#stepup-crew-preview .su-result-info .su-label{font-size:12px;margin-bottom:4px}
#stepup-crew-preview .su-success{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#124b50;color:#74eac8;margin-bottom:14px}
#stepup-crew-preview .su-message{font-size:13px;color:#d0e1f5;line-height:1.8;white-space:pre-line}
#stepup-crew-preview .su-summary-row{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;color:var(--su-label)}
#stepup-crew-preview .su-summary-row strong{color:var(--su-text);font-weight:600}
#stepup-crew-preview #cp-toast{position:absolute;left:20px;right:20px;bottom:26px;z-index:30;background:#e2efff;color:#0a2743;border-radius:12px;padding:12px 15px;font-size:12px;font-weight:600;box-shadow:0 4px 20px #00132250;display:none;text-align:center;line-height:1.6}

if(id==='CR19')return entry()+sheet('오늘 함께 달릴 크루', ['한강 크루','서울 러너스'].map((n,i)=>'<button type="button" class="su-option '+(pendingCrew===n?'selected':'')+'" data-crew="'+n+'"><span class="su-emblem" style="width:42px;height:42px;border-radius:12px;font-size:16px">'+(i?'SR':'HG')+'</span><span><strong>'+n+'</strong><br><span class="su-small">'+(i?'서울 · 잠실':'서울 · 한강')+'</span></span><span class="su-radio"></span></button>').join(''),button('이 크루 선택','applyCrew'),'CR03');
if(id==='CR17')return lobby('before')+sheet('달리기 전에 확인해요','<p class="su-copy">위치 사용과 크루원에게 위치 공유는<br>각각 선택할 수 있어요.</p><div class="su-spacer"></div><div class="su-card"><div class="su-row"><span>'+icon('map-pin')+' 위치 사용</span><span style="color:#ffc49a;font-size:12px">허용 필요</span></div><p class="su-small" style="margin-bottom:0">러닝 경로와 위치를 기록할 때 사용해요.</p></div>'+toggle('크루원에게 내 위치 공유','위치 공유는 기본으로 꺼져 있어요.','location',shareLocation)+'<p class="su-small">위치 사용을 허용해도 크루원에게 자동 공유되지 않아요.</p>',button('위치 사용 허용','allow')+button('나중에','unready','secondary'),'CR04');
if(id==='CR07')return lobby('host')+sheet('준비한 4명과 출발할까요?','<p class="su-copy">아직 준비하지 않은 2명은<br>이번 출발에 함께하지 않아요.</p><div class="su-ready-count"><div><strong style="color:#6bdfff">4</strong><span class="su-label">준비 완료</span></div><div><strong>2</strong><span class="su-label">준비 전</span></div></div>',button('4명과 출발하기','count')+button('조금 더 기다리기','host','secondary'),'CR06');
if(id==='CR10')return run()+sheet('함께 달리는 사람 · '+departureCount+'명',memberRows('ready',false,true)+toggle('내 위치·거리 공유','공유를 켠 크루원의 거리만 표시해요.','location',shareLocation),button('확인','resume'),'CR09');
if(id==='CR12')return run(true)+sheet('내 러닝을 마칠까요?','<p class="su-copy">내 기록을 저장하고 종료해요.<br>다른 크루원은 계속 달릴 수 있어요.</p>'+stats()+'<div class="su-notice">'+icon('users-round')+'크루 전체의 러닝은 종료되지 않아요.</div>',button('저장하고 종료','save')+button('계속 달리기','resume','secondary'),'CR11');
if(id==='CR20')return lobby('alone')+sheet('크루에게 알리기','<p class="su-copy">'+crew+' 채팅으로 보낼 내용이에요.</p><div class="su-card" style="margin-top:15px"><div class="su-label" style="margin-bottom:9px">'+crew+'</div><div class="su-message">지금 크루 달리기를 준비하고 있어요.\n대기실에서 함께 달려요!</div></div>'+(notified?'<div class="su-notice" style="margin-top:12px">'+icon('check')+'미리보기에서 알림을 보냈어요.</div>':''),notified?button('확인','alone'):button('알림 보내기','sendNotify')+button('취소','alone','secondary'),'CR15');
return '';
}
const backMap={CR03:'CR03',CR02:'CR03',CR14:'CR03',CR04:'CR03',CR05:'CR04',CR06:'CR04',CR15:'CR03',CR08:'CR06',CR16:'CR03',CR13:'CR09',CR21:'CR13',CR11:'CR09',CR18:'CR09'};
const modalBack={CR19:'CR03',CR17:'CR04',CR07:'CR06',CR10:'CR09',CR12:'CR11',CR20:'CR15'};
function draw(){const s=screens.find(x=>x.id===current);picker.value=current;root.querySelector('#cp-position').textContent=(screens.indexOf(s)+1)+' / '+screens.length;root.querySelector('#cp-description').textContent=s.desc;root.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.group===s.group)));let html='';switch(current){case'CR03':html=entry();break;case'CR02':html=roomPreview();break;case'CR14':html=noCrew();break;case'CR04':html=lobby();break;case'CR05':html=lobby('ready');break;case'CR06':html=lobby('host');break;case'CR15':html=lobby('alone');break;case'CR08':html=countdownScreen();break;case'CR16':html=departed();break;case'CR09':html=run();break;case'CR11':html=run(true);break;case'CR18':html=run(false,true);break;case'CR13':html=result();break;case'CR21':html=share();break;default:html=overlay(current);}mount.innerHTML=html;mount.dataset.screen=current;mount.querySelectorAll('button,input,select').forEach(el=>el.classList.add('cursor-interaction'));const base=modalBack[current];if(base){const dialog=mount.querySelector('[role="dialog"]');Array.from(mount.children).filter(el=>!el.classList.contains('su-modal-overlay')).forEach(el=>{el.inert=true;});requestAnimationFrame(()=>{if(dialog.isConnected)dialog.querySelector('button,input')?.focus({preventScroll:true});});}if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});}
function go(id){if(!screens.some(s=>s.id===id))return;clearInterval(countTimer);clearTimeout(toastTimer);root.querySelector('#cp-toast').style.display='none';counting=false;countdown=3;current=id;draw();}
function toast(text){clearTimeout(toastTimer);const el=root.querySelector('#cp-toast');el.textContent=text;el.style.display='block';toastTimer=setTimeout(()=>el.style.display='none',3000);}
function count(){departureCount=current==='CR07'||current==='CR06'?4:current==='CR15'?1:6;go('CR08');counting=true;countdown=3;draw();countTimer=setInterval(()=>{countdown--;if(countdown>0){const d=root.querySelector('#cp-digit');if(d)d.textContent=countdown;}else{clearInterval(countTimer);counting=false;runKm='0.00';runTime='00:00';runPct=0;go('CR09');toast('함께 출발했어요!');}},900);}
const actions={entry:()=>go('CR03'),enter:()=>go('CR04'),pick:()=>{pendingCrew=crew;go('CR19');},applyCrew:()=>{crew=pendingCrew;go('CR03');},ready:()=>go('CR17'),allow:()=>{go('CR05');toast('미리보기에서 준비를 완료했어요.');},unready:()=>go('CR04'),host:()=>go('CR06'),confirmStart:()=>go('CR07'),count,alone:()=>go('CR15'),notify:()=>go('CR20'),members:()=>go('CR10'),pause:()=>go('CR11'),resume:()=>go('CR09'),finish:()=>go('CR12'),save:()=>go('CR13'),share:()=>{shared=false;go('CR21');},result:()=>go('CR13'),reconnect:()=>{go('CR09');toast('크루에 다시 연결됐어요.');},sendShare:()=>{shared=true;draw();toast('공유 완료를 미리보기로 표시했어요. 실제 전송은 없어요.');},sendNotify:()=>{notified=true;draw();toast('알림 완료를 미리보기로 표시했어요. 실제 전송은 없어요.');},recenter:()=>toast('내 위치를 중심으로 보고 있어요.'),back:()=>go(modalBack[current]||backMap[current]||'CR03'),find:()=>toast('크루 찾기는 별도 크루 메뉴에서 이어져요.'),create:()=>toast('크루 만들기는 별도 크루 메뉴에서 이어져요.'),free:()=>toast('이 미리보기는 크루 달리기 화면만 포함해요.'),noop:()=>{}};
root.querySelector('.cp-stages').innerHTML=groups.map((g,i)=>'<button class="btn" type="button" data-group="'+i+'" aria-pressed="'+(i===3)+'">'+g[0]+'</button>').join('');
picker.innerHTML=groups.map((g,i)=>'<optgroup label="'+g[0]+'">'+screens.filter(s=>s.group===i).map(s=>'<option value="'+s.id+'">'+s.name+' · '+s.id+'</option>').join('')+'</optgroup>').join('');
function resetSample(){departureCount=6;runKm='3.24';runTime='24:18';runPct=65;shared=false;notified=false;}
picker.addEventListener('change',()=>{resetSample();go(picker.value);});
root.addEventListener('click',e=>{const buttonEl=e.target.closest('button');if(buttonEl&&root.contains(buttonEl)){if(buttonEl.disabled)return;if(buttonEl.dataset.group!==undefined){resetSample();go(groups[+buttonEl.dataset.group][1]);return;}if(buttonEl.dataset.step){resetSample();const i=screens.findIndex(s=>s.id===current);go(screens[(i+Number(buttonEl.dataset.step)+screens.length)%screens.length].id);return;}if(buttonEl.dataset.state){go(buttonEl.dataset.state);return;}if(buttonEl.dataset.crew){pendingCrew=buttonEl.dataset.crew;draw();return;}const fn=actions[buttonEl.dataset.action];if(fn)fn();}else if(e.target.classList.contains('su-modal-overlay'))go(e.target.dataset.overlay);});
root.addEventListener('change',e=>{if(e.target.dataset.toggle==='location'){shareLocation=e.target.checked;}if(e.target.dataset.toggle==='route'){includeRoute=e.target.checked;draw();}});
root.addEventListener('keydown',e=>{const dialog=mount.querySelector('[role="dialog"]');if(!dialog)return;if(e.key==='Escape'){e.preventDefault();go(modalBack[current]);}if(e.key==='Tab'){const focusable=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
draw();
})();
</script>
</body></html>
