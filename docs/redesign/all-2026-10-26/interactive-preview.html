&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#stepup-revision .su-preview{padding:18px 0 22px;display:flex;justify-content:center;}
#stepup-revision .su-phone{--su-bg:light-dark(#f4f5fa,#080e1b);--su-surface:light-dark(#fff,#121b2c);--su-ink:light-dark(#10192c,#f5f7ff);--su-muted:light-dark(#606a7b,#a1aec4);--su-line:light-dark(#dfe3eb,#253148);--su-blue:light-dark(#2458e9,#4278ff);--su-soft:light-dark(#e8efff,#192c50);--su-red:light-dark(#b12a3e,#ff8f9d);--su-nav:light-dark(#fafbff,#0c1423);font-family:Paperlogy,&#x27;Malgun Gothic&#x27;,sans-serif;color:var(--su-ink);background:var(--su-bg);width:390px;max-width:100%;min-height:845px;border-radius:28px;box-shadow:0 0 0 1px var(--su-line),0 20px 52px #00000020;position:relative;overflow:hidden;font-size:14px;line-height:1.5;text-align:left;letter-spacing:-.35px;}
#stepup-revision .su-phone[data-theme=dark]{color-scheme:dark}
#stepup-revision .su-phone[data-theme=light]{color-scheme:light}
#stepup-revision .su-phone *{box-sizing:border-box;}
#stepup-revision .su-phone button,#stepup-revision .su-phone input,#stepup-revision .su-phone textarea,#stepup-revision .su-phone select{font:inherit;letter-spacing:inherit;}
#stepup-revision .su-phone button{color:inherit;border:0;background:none;}
#stepup-revision .su-phone button:disabled{opacity:.45;cursor:not-allowed;}
#stepup-revision .su-phone button:focus-visible,#stepup-revision .su-phone input:focus-visible,#stepup-revision .su-phone textarea:focus-visible,#stepup-revision .su-phone select:focus-visible{outline:3px solid var(--su-blue);outline-offset:3px;}
#stepup-revision .su-phone h1,#stepup-revision .su-phone h2,#stepup-revision .su-phone h3,#stepup-revision .su-phone p{margin:0;}
#stepup-revision .su-phone h1{font-size:25px;font-weight:700;line-height:1.3;letter-spacing:-1.2px;}
#stepup-revision .su-phone h2{font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.6px;}
#stepup-revision .su-phone h3{font-size:16px;font-weight:600;line-height:1.4;}
#stepup-revision .su-phone svg{width:21px;height:21px;flex-shrink:0;stroke-width:1.8;}
#stepup-revision .su-status{display:flex;align-items:center;justify-content:space-between;height:39px;padding:8px 24px 2px;font-family:Arial,sans-serif;font-size:13px;font-weight:600;letter-spacing:0;}
#stepup-revision .su-status-right{display:flex;align-items:center;gap:5px;}
#stepup-revision .su-status-right svg{width:14px;height:14px;}
#stepup-revision .su-top{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 18px;gap:9px;}
#stepup-revision .su-icon{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
#stepup-revision .su-top strong{font-size:17px;font-weight:600;}
#stepup-revision .su-top .su-save{font-size:13px;color:var(--su-muted);padding:12px 4px;}
#stepup-revision .su-brand{font-family:&#x27;Saira Condensed&#x27;,sans-serif;font-weight:800;font-size:27px;font-style:italic;letter-spacing:-.9px;line-height:1;}
#stepup-revision .su-brand span{color:var(--su-blue);}
#stepup-revision .su-content{padding:8px 24px 20px;}
#stepup-revision .su-muted{color:var(--su-muted);}
#stepup-revision .su-small{font-size:12px;line-height:1.5;}
#stepup-revision .su-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
#stepup-revision .su-field{display:block;margin-top:18px;}
#stepup-revision .su-label{display:block;color:var(--su-muted);font-size:12px;margin-bottom:7px;}
#stepup-revision .su-input{width:100%;background:var(--su-surface);color:var(--su-ink);border:1px solid var(--su-line);border-radius:11px;padding:12px 13px;min-height:48px;font-size:16px!important;}
#stepup-revision .su-input::placeholder{color:var(--su-muted);opacity:1;}
#stepup-revision .su-title-input{font-size:20px!important;font-weight:600!important;background:transparent;border:0;border-bottom:1px solid var(--su-line);border-radius:0;padding:6px 0 12px;}
#stepup-revision .su-location{width:100%;display:flex;align-items:center;text-align:left;gap:11px;padding:12px 13px!important;background:var(--su-surface)!important;border:1px solid var(--su-line)!important;border-radius:11px;}
#stepup-revision .su-location&gt;svg:first-child{color:var(--su-blue);}
#stepup-revision .su-location .su-grow{flex:1;min-width:0;}
#stepup-revision .su-location strong{font-size:14px;font-weight:600;display:block;}
#stepup-revision .su-location small{font-size:11px;color:var(--su-muted);display:block;margin-top:3px;}
#stepup-revision .su-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
#stepup-revision .su-grid2 .su-field{margin-top:15px;min-width:0;}
#stepup-revision .su-inline-note{font-size:12px;color:var(--su-blue);margin-top:6px!important;}
#stepup-revision .su-value-wrap{position:relative;}
#stepup-revision .su-value-wrap input{padding-right:42px;}
#stepup-revision .su-unit{position:absolute;right:13px;top:14px;color:var(--su-muted);font-size:13px;pointer-events:none;}
#stepup-revision .su-capacity{padding:15px 0;margin-top:6px;border-bottom:1px solid var(--su-line);}
#stepup-revision .su-stepper{display:flex;align-items:center;gap:4px;}
#stepup-revision .su-stepper button{width:42px;height:42px;border:1px solid var(--su-line);border-radius:50%;display:flex;align-items:center;justify-content:center;}
#stepup-revision .su-stepper output{min-width:36px;text-align:center;font-size:18px;font-weight:600;}
#stepup-revision .su-note{min-height:68px;resize:vertical;font-size:14px!important;line-height:1.5;}
#stepup-revision .su-primary{min-height:54px;width:100%;padding:9px 11px 9px 20px!important;border-radius:30px;background:var(--su-blue)!important;color:#fff!important;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;gap:10px;}
#stepup-revision .su-arrow{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#204dd2;background:#fff;}
#stepup-revision .su-footer{padding:14px 24px 20px;margin-top:auto;}
#stepup-revision .su-footer p{text-align:center;font-size:11px;color:var(--su-muted);margin-top:9px;}
#stepup-revision .su-scene{min-height:806px;display:flex;flex-direction:column;}
#stepup-revision .su-scene[hidden],#stepup-revision [hidden]{display:none!important;}
#stepup-revision .su-error{display:none;color:var(--su-red);font-size:12px;margin-top:6px!important;}
#stepup-revision .su-error:not(:empty){display:block;}
#stepup-revision .su-input[aria-invalid=true],#stepup-revision .su-location[aria-invalid=true]{border-color:var(--su-red)!important;}
#stepup-revision .su-profile{display:flex;align-items:center;gap:12px;margin:9px 0 22px;}
#stepup-revision .su-avatar{width:49px;height:49px;background:var(--su-photo) 95% 76%/360%;border-radius:50%;border:2px solid var(--su-line);}
#stepup-revision .su-profile h1{font-size:22px;}
#stepup-revision .su-profile p{font-size:12px;color:var(--su-muted);margin-top:3px;}
#stepup-revision .su-achievement{position:relative;min-height:277px;background:#08142c;border-radius:18px;color:#fff;padding:22px;isolation:isolate;overflow:hidden;}
