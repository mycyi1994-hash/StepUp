(() => {
  const root=document.getElementById('stepup-rankings-refined');
  const phones=[...root.querySelectorAll('[data-design]')];
  const state={crew:{rowHeight:58,bgIntensity:80},personal:{mode:'nearby',rowHeight:46,bgIntensity:90},points:{scope:'all',rowHeight:48,bgIntensity:80}};
  const motionState={enabled:true};
  const backgroundToggle=root.querySelector('[data-background-toggle]');
  const onScreen=new Map(phones.map(phone=>[phone,false]));
  const ranges={crew:[56,62],personal:[44,48],points:[46,50]};
  const context=new Map();
  const topCrew=[['서울러닝클럽','S',32.6,'42명 참여',2],['새벽다섯시','5',29.8,'31명 참여',1],['러닝메이트','M',27.4,'28명 참여',-1],['반포페이스','B',26.1,'24명 참여',2],['성수스트라이드','S',25.7,'36명 참여',-1]].map((v,i)=>({name:v[0],mark:v[1],score:v[2],sub:v[3],move:v[4],rank:i+1}));
  const crewNearby=[['서촌러너스','S',19.8],['라이트페이스','L',18.9],['한강러너스','H',18.4],['반포러닝','B',17.6],['오후다섯시','5',16.7]].map((v,i)=>({name:v[0],mark:v[1],score:v[2],sub:i===2?'우리 크루 · 38명 참여':'1인당 러닝 거리',rank:10+i,isMe:i===2}));
  const nearby=[['예린','예',34.8],['서연','서',33.4],['가나','가',32.6],['민수','민',31.9],['은지','은',31.4]].map((v,i)=>({name:v[0],mark:v[1],score:v[2],rank:125+i,isMe:i===2}));
  const topPersonal=[['지훈','지',128.4],['서윤','서',116.8],['민재','민',108.2],['지수','지',96.7],['현우','현',92.5]].map((v,i)=>({name:v[0],mark:v[1],score:v[2],rank:i+1}));
  const pointRows={all:[['지훈','지',9840,'서울러닝클럽'],['지수','지',9120,'한강러너스'],['서윤','서',8880,'새벽다섯시'],['현우','현',8450,'한강러너스'],['민재','민',8210,'러닝메이트']],crew:[['지수','지',9120,'한강러너스'],['현우','현',8450,'한강러너스'],['서연','서',5800,'한강러너스'],['예린','예',4210,'한강러너스'],['민수','민',3120,'한강러너스']]};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=(n,kind)=>new Intl.NumberFormat('ko-KR',{minimumFractionDigits:kind==='points'?0:1,maximumFractionDigits:kind==='points'?0:1}).format(n);
  const unit=kind=>kind==='points'?'P':'km';
  const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});};
  const avatar=(r,kind)=>`<span class="lb-avatar ${kind==='crew'?'crew':''}" aria-hidden="true">${esc(r.mark)}</span>`;
  function row(r,kind,compact=false){return `<div class="lb-row ${r.isMe?'is-me':''}"><span class="lb-rank">${r.rank}</span>${avatar(r,kind)}<div class="lb-person"><p class="lb-name">${esc(r.name)}${r.isMe?' <span class="sr-only">나의 순위</span>':''}</p>${!compact&&r.sub?`<p class="lb-sub">${esc(r.sub)}</p>`:''}</div><p class="lb-value">${fmt(r.score,kind)}<small>${unit(kind)}</small></p></div>`;}
  function render(phone){
    const design=phone.dataset.design,s=state[design],content=phone.querySelector('[data-content]'),footer=phone.querySelector('[data-footer]');phone.style.setProperty('--lb-row-height',s.rowHeight+'px');phone.style.setProperty('--lr-motion-opacity',s.bgIntensity/100);
    if(design==='crew'){
      const first=topCrew[0];
      content.innerHTML=`<section class="lr-winner" aria-label="1위 ${first.name}, 1인당 ${first.score}km"><span class="lr-winner-number" aria-hidden="true">1</span><div class="lr-winner-head"><span><i data-lucide="crown" aria-hidden="true"></i>이번 주 1위</span><span class="lb-move"><i data-lucide="chevron-up" aria-hidden="true"></i>2계단 상승</span></div><div class="lr-winner-person">${avatar(first,'crew')}<div><p class="lr-winner-name">${first.name}</p><p class="lr-winner-sub">42명의 러너가 함께 만든 기록</p></div></div><p class="lr-winner-score"><strong>${fmt(first.score,'crew')}</strong><span>km</span><small>참여 러너 1인당</small></p></section><div class="lr-runners-up">${topCrew.slice(1,3).map((r,i)=>`<div class="lr-runner-up ${i?'third':''}"><span class="lr-runner-rank">${r.rank}</span><div class="lr-runner-info"><p class="lb-name">${r.name}</p><p class="lb-value">${fmt(r.score,'crew')}<small>km</small></p></div></div>`).join('')}</div><div class="lb-list-head"><b>이번 주 크루 순위</b><span>1인당 거리</span></div>${topCrew.slice(3,5).map(r=>row(r,'crew')).join('')}`;
      footer.innerHTML='<button type="button" class="lb-mybar cursor-interaction" data-action="crew-nearby" aria-label="우리 크루 주변 순위 보기"><span class="lb-rank">12</span><div class="lb-person"><p class="lb-name">한강러너스</p><p class="lb-sub">우리 크루 · 3계단 상승</p></div><p class="lb-value">18.4<small>km</small></p><i class="lb-chevron" data-lucide="chevron-right" aria-hidden="true"></i></button>';
    }else if(design==='personal'){
      content.innerHTML=`<section class="lr-personal-hero" aria-label="나의 주간 순위 127위, 지난주보다 12계단 상승"><div><p class="lr-personal-label">가나, 이번 주 나의 순위</p><p class="lr-personal-rank">127<small>위</small></p></div><div class="lr-rise"><div class="lr-rise-number"><i data-lucide="arrow-up-right" aria-hidden="true"></i>12</div><p>지난주보다<br>12계단 상승</p></div></section><div class="lr-next"><div><p class="lr-next-name">바로 앞은 서연</p><p class="lr-next-sub">126위 · 이번 주 33.4km</p></div><p class="lr-next-value">0.8<small>km</small><span>현재 기록 차이</span></p></div><div class="lb-local-toggle" role="group" aria-label="개인 러닝 순위 범위"><button type="button" class="cursor-interaction" data-mode="nearby" aria-pressed="${s.mode==='nearby'}">내 주변 순위</button><button type="button" class="cursor-interaction" data-mode="top" aria-pressed="${s.mode==='top'}">상위 러너</button></div><div class="lb-ladder">${(s.mode==='top'?topPersonal:nearby).map(r=>row(r,'personal',true)).join('')}</div>`;
      footer.innerHTML='<button type="button" class="lr-personal-footer cursor-interaction" data-action="records" aria-label="나의 이번 주 러닝 기록 보기"><span class="lb-avatar" aria-hidden="true">가</span><div class="lb-person"><p class="lb-name">가나</p><p class="lb-sub">이번 주 4회 러닝</p></div><p class="lb-value">32.6<small>km</small></p></button>';
    }else{
      const local=s.scope==='crew',rank=local?8:84,rows=pointRows[s.scope].map((v,i)=>({name:v[0],mark:v[1],score:v[2],sub:i===0?'이번 주 1위':v[3],rank:i+1}));
      content.innerHTML=`<section class="lr-points-hero" aria-label="이번 주 적립 2680포인트, ${rank}위"><p class="lr-points-label">가나의 이번 주 적립 포인트</p><div class="lr-points-main"><p class="lr-points-number">2,680<span>P</span></p><p class="lr-points-rank">${rank}<small>위</small></p></div><p class="lr-points-change"><i data-lucide="trending-up" aria-hidden="true"></i>지난주보다 310P 더 적립했어요</p></section><div class="lr-scope" role="group" aria-label="포인트 순위 범위"><button type="button" class="cursor-interaction" data-scope="all" aria-pressed="${!local}">전체 러너</button><button type="button" class="cursor-interaction" data-scope="crew" aria-pressed="${local}">우리 크루</button><span>${local?'한강러너스':'주간 포인트'}</span></div><div class="lb-list-head"><b>${local?'크루 내 포인트 순위':'이번 주 포인트 순위'}</b><span>적립 포인트</span></div><div class="lr-points-list">${rows.map(r=>row(r,'points')).join('')}</div>`;
      footer.innerHTML=`<button type="button" class="lr-gap-footer cursor-interaction" data-action="point-nearby"><div class="lb-person"><p>${rank-1}위와의 포인트 차이</p><small>내 주변 순위 보기</small></div><strong>80<small>P</small></strong><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
    }
    icons();
  }
  function save(design){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{refinedLeaderboard:design,animatedBackground:motionState.enabled},privateContent:{refinedRankings:state,motionEnabled:motionState.enabled}}).catch(()=>{});}
  function restore(saved){if(!saved||typeof saved!=='object')return;for(const [design,s]of Object.entries(saved)){if(!Object.hasOwn(state,design)||!s||typeof s!=='object')continue;if(design==='personal'&&['nearby','top'].includes(s.mode))state.personal.mode=s.mode;if(design==='points'&&['all','crew'].includes(s.scope))state.points.scope=s.scope;if(Number.isFinite(s.rowHeight))state[design].rowHeight=Math.max(ranges[design][0],Math.min(ranges[design][1],s.rowHeight));if(Number.isFinite(s.bgIntensity))state[design].bgIntensity=Math.max(35,Math.min(100,s.bgIntensity));}}
  function syncMotion(){phones.forEach(phone=>{phone.dataset.motionActive=String(motionState.enabled&&!document.hidden&&onScreen.get(phone)&&phone.querySelector('.lb-overlay').hidden);});}
  function applyBackground(){root.dataset.background=motionState.enabled?'on':'off';backgroundToggle.checked=motionState.enabled;syncMotion();}
  function open(phone,title,body){context.set(phone,document.activeElement);phone.querySelector('[data-sheet-title]').textContent=title;phone.querySelector('[data-sheet-content]').innerHTML=body;phone.querySelector('.lb-overlay').hidden=false;phone.querySelector('.lb-body').inert=true;phone.querySelector('.lb-footer').inert=true;syncMotion();icons();phone.querySelector('[data-action="close"]').focus({preventScroll:true});}
  function close(phone){phone.querySelector('.lb-overlay').hidden=true;phone.querySelector('.lb-body').inert=false;phone.querySelector('.lb-footer').inert=false;syncMotion();const target=context.get(phone);if(target?.isConnected)target.focus({preventScroll:true});}
  const rules={crew:'<div class="lb-rule"><h4>참여 러너 1인당 거리</h4><p>이번 주 크루 전체 러닝 거리 ÷ 이번 주 달린 크루원 수로 비교해요. 크루 규모와 함께 실제 참여 인원을 보여줘요.</p></div>',personal:'<div class="lb-rule"><h4>이번 주 누적 러닝 거리</h4><p>이번 주에 달린 거리를 모두 더해 비교해요. 바로 앞 러너와의 차이는 현재 집계된 기록 기준이에요.</p></div>',points:'<div class="lb-rule"><h4>이번 주 적립 포인트</h4><p>이번 주에 적립한 포인트로만 순위를 매겨요. 보유 잔액과는 다른 숫자예요. 전체 러너와 크루 내 순위를 각각 볼 수 있어요.</p></div>'};
  restore(window.openai?.widgetState?.privateContent?.refinedRankings);
  if(typeof window.openai?.widgetState?.privateContent?.motionEnabled==='boolean')motionState.enabled=window.openai.widgetState.privateContent.motionEnabled;
  applyBackground();
  phones.forEach(phone=>{
    const design=phone.dataset.design;render(phone);
    phone.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||!phone.contains(b))return;
      if(b.dataset.mode){state.personal.mode=b.dataset.mode;render(phone);phone.querySelector(`[data-mode="${state.personal.mode}"]`).focus({preventScroll:true});save(design);root.querySelector('[data-live]').textContent=state.personal.mode==='top'?'상위 러너 순위':'내 주변 순위';return;}
      if(b.dataset.scope){state.points.scope=b.dataset.scope;render(phone);phone.querySelector(`[data-scope="${state.points.scope}"]`).focus({preventScroll:true});save(design);root.querySelector('[data-live]').textContent=state.points.scope==='crew'?'우리 크루 포인트 순위':'전체 러너 포인트 순위';return;}
      if(b.dataset.action==='close'){close(phone);return;}
      if(b.dataset.action==='rules'){open(phone,'순위 기준',rules[design]);return;}
      if(b.dataset.action==='crew-nearby'){open(phone,'우리 크루 주변 순위','<p class="lb-sheet-note">이번 주 · 참여 러너 1인당 거리</p>'+crewNearby.map(r=>row(r,'crew')).join(''));return;}
      if(b.dataset.action==='records'){
        const records=[['10월 17일','토요일',12.8],['10월 15일','목요일',4.8],['10월 14일','수요일',8.6],['10월 12일','월요일',6.4]];
        open(phone,'이번 주 나의 러닝','<p class="lb-sheet-note">4회 러닝 · 총 32.6km</p>'+records.map(r=>`<div class="lr-run-record"><p>${r[0]}<small>${r[1]}</small></p><strong>${fmt(r[2],'personal')}<small>km</small></strong></div>`).join(''));return;
      }
      if(b.dataset.action==='point-nearby'){
        const local=state.points.scope==='crew',mine=local?8:84,values=local?[['하린','하',2860],['다은','다',2760],['가나','가',2680],['정우','정',2630],['은지','은',2560]]:[['다은','다',2860],['서연','서',2760],['가나','가',2680],['민수','민',2630],['정우','정',2560]],neighbors=values.map((v,i)=>({name:v[0],mark:v[1],score:v[2],rank:mine+i-2,isMe:i===2,sub:i===2?'나의 이번 주 적립':'이번 주 적립'}));
        open(phone,'내 주변 포인트 순위',`<p class="lb-sheet-note">${state.points.scope==='crew'?'한강러너스':'전체 러너'} · 이번 주 적립 기준</p>`+neighbors.map(r=>row(r,'points')).join(''));
      }
    });
    phone.querySelector('.lb-overlay').addEventListener('click',e=>{if(e.target.classList.contains('lb-overlay'))close(phone);});
    phone.addEventListener('keydown',e=>{if(phone.querySelector('.lb-overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();close(phone);}if(e.key==='Tab'){e.preventDefault();phone.querySelector('[data-action="close"]').focus();}});
    if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--lb-row-height',state[design].rowHeight+'px');phone.style.setProperty('--lr-motion-opacity',state[design].bgIntensity/100);}});tweak.addSlider(state[design],'rowHeight',{label:'목록 행 간격',min:ranges[design][0],max:ranges[design][1],step:1,unit:'px',reference:'--lb-row-height'});tweak.addSlider(state[design],'bgIntensity',{label:'배경 밝기',min:35,max:100,step:5,unit:'%',reference:'--lr-motion-opacity'});}
  });
  backgroundToggle.addEventListener('change',()=>{motionState.enabled=backgroundToggle.checked;applyBackground();const active=phones.find(phone=>onScreen.get(phone));save(active?.dataset.design||'crew');});
  let observer=null;
  if(typeof IntersectionObserver==='function'){observer=new IntersectionObserver(entries=>{entries.forEach(entry=>onScreen.set(entry.target,entry.isIntersecting&&entry.intersectionRatio>=.05));syncMotion();},{threshold:.05});phones.forEach(phone=>observer.observe(phone));}
  else{phones.forEach(phone=>onScreen.set(phone,!phone.closest('[data-variant]').hidden));syncMotion();}
  document.addEventListener('visibilitychange',syncMotion);
  window.addEventListener('pagehide',()=>{observer?.disconnect();phones.forEach(phone=>phone.dataset.motionActive='false');});
  window.addEventListener('pageshow',()=>{if(observer)phones.forEach(phone=>observer.observe(phone));syncMotion();});
  window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;restore(saved?.refinedRankings);if(typeof saved?.motionEnabled==='boolean')motionState.enabled=saved.motionEnabled;phones.forEach(render);applyBackground();});
})();
</script>
