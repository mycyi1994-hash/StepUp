<script>
(() => {
  const root = document.getElementById('su-free-start');
  const frame = root.querySelector('.su-frame');
  const check = root.querySelector('.su-check');
  const count = root.querySelector('.su-count');
  const film = root.querySelector('.su-film');
  const number = root.querySelector('.su-number');
  const sweep = root.querySelector('.su-film-sweep');
  const launch = root.querySelector('.su-launch');
  const wordmark = root.querySelector('.su-launch-wordmark');
  const wash = root.querySelector('.su-iris-wash');
  const blue = root.querySelector('.su-iris-blue');
  const run = root.querySelector('.su-run');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const buttons = [...root.querySelectorAll('[data-preview]')];
  const live = root.querySelector('[data-live]');
  const assetsReady = Promise.all([...root.querySelectorAll('img')].map(img => typeof img.decode === 'function' ? img.decode().catch(() => {}) : Promise.resolve()));
  let controller = null, animations = [], clock = null, elapsed = 0, paused = false, returnFocus = null;
  function announce(text) { live.textContent = text; }
  function wait(ms, signal) {
    return new Promise(resolve => {
      if (signal.aborted) { resolve(false); return; }
      const abort = () => { clearTimeout(timer); resolve(false); };
      const timer = setTimeout(() => { signal.removeEventListener('abort', abort); resolve(true); }, ms);
      signal.addEventListener('abort', abort, { once: true });
    });
  }
  function reset() {
    if (controller) controller.abort(); controller = new AbortController();
    animations.forEach(a => a.cancel()); animations = [];
    if (clock) clearInterval(clock); clock = null; elapsed = 0; paused = false;
    check.hidden = true; count.hidden = true; launch.hidden = true; wash.hidden = true; blue.hidden = true; run.hidden = true;
    check.inert = false; count.inert = false; run.inert = false;
    root.querySelector('.su-home').inert = false;
    [wash, blue, run].forEach(el => { el.style.clipPath = 'circle(0px at 50% 50%)'; el.style.opacity = '1'; });
    root.querySelector('.su-time').textContent = '00:00';
    root.querySelector('.su-live-label').textContent = '러닝 중';
    root.querySelector('.su-pause-label').textContent = '일시정지';
    root.querySelector('.su-home-indicator').style.color = '#fff';
    return controller.signal;
  }
  function active(name) { buttons.forEach(b => { if (b.dataset.preview !== 'all') b.setAttribute('aria-pressed', String(b.dataset.preview === name)); }); }
  function motion(el, keys, options) {
    const { startAt, ...timing } = options;
    const a = el.animate(keys, { fill: 'forwards', ...timing });
    if (startAt != null) a.startTime = startAt;
    animations.push(a); a.finished.catch(() => {}); return a;
  }
  function save(view) {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{stepupStartPreview:view},privateContent:{view}}).catch(() => {});
  }
  function showCheck(animate = true, focus = false) {
    reset(); frame.dataset.phase = 'check'; check.hidden = false;
    root.querySelector('.su-home').inert = true;
    root.querySelector('.su-home-indicator').style.color = '#fff'; active('check'); announce('출발 전 신발 점검');
    if (animate) {
      motion(root.querySelector('.su-backdrop'), [{opacity:0},{opacity:1}], {duration:250,easing:'cubic-bezier(.23,1,.32,1)'});
      motion(root.querySelector('.su-check-card'), reduced.matches ? [{opacity:0},{opacity:1}] : [{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}], {duration:250,easing:'cubic-bezier(.23,1,.32,1)'});
    }
    if (focus) { returnFocus = document.activeElement; root.querySelector('[data-action="start"]').focus({preventScroll:true}); }
  }
  function showHome() {
    reset(); frame.dataset.phase = 'home'; active('check'); announce('자유러닝 시작 화면');
    if (returnFocus?.isConnected) returnFocus.focus({preventScroll:true});
  }
  function showCountBase() {
    count.hidden = false; frame.dataset.phase = 'count'; root.querySelector('.su-home').inert = true;
    root.querySelector('.su-home-indicator').style.color = '#fff'; active('count');
  }
  function setCount(value) {
    number.textContent=String(value); announce(String(value));
    if (!reduced.matches) motion(number,[{opacity:.6,transform:'translateY(6px) scale(.96)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:160,easing:'cubic-bezier(.23,1,.32,1)'});
  }
  async function countdown(continueToRun = true) {
    const signal = reset(); showCountBase(); number.textContent='3';
    await assetsReady; if (signal.aborted) return;
    if (!reduced.matches) motion(sweep,[{transform:'rotate(0deg)'},{transform:'rotate(1260deg)'}],{duration:3500,easing:'linear'});
    for (const value of [3,2,1]) {
      setCount(value);
      if (!await wait(1000, signal)) return;
    }
    setCount(0);
    if (!await wait(180, signal)) return;
    if (!await showLaunch(signal)) return;
    if (continueToRun) await reveal(signal);
  }
  async function showLaunch(signal) {
    if (signal.aborted) return false;
    frame.dataset.phase='launch'; launch.hidden=false; count.inert=true; announce('StepUP!');
    const startAt=document.timeline.currentTime;
    motion(film,reduced.matches ? [{opacity:1},{opacity:0}] : [
      {opacity:1,transform:'translateY(0) scale(1)'},
      {opacity:0,transform:'translateY(-10px) scale(1.04)'}
    ],{startAt,duration:reduced.matches?200:300,easing:'cubic-bezier(.23,1,.32,1)'});
    motion(wordmark,reduced.matches ? [{opacity:0},{opacity:1}] : [
      {opacity:0,transform:'translateX(-18px) scale(.96)',offset:0},
      {opacity:1,transform:'translateX(3px) scale(1.025)',offset:.72},
      {opacity:1,transform:'translateX(0) scale(1)',offset:1}
    ],{startAt,duration:reduced.matches?200:300,easing:'cubic-bezier(.23,1,.32,1)'});
    return await wait(580,signal);
  }
  function startClock() {
    clock = setInterval(() => {
      if (paused) return; elapsed++;
      root.querySelector('.su-time').textContent = String(Math.floor(elapsed/60)).padStart(2,'0') + ':' + String(elapsed%60).padStart(2,'0');
    },1000);
  }
  async function reveal(signal) {
    if (signal.aborted) return;
    frame.dataset.phase = 'reveal'; active('reveal'); count.inert = true; run.hidden = false; startClock();
    const startAt=document.timeline.currentTime;
    const radius = Math.ceil(Math.hypot(frame.clientWidth/2,frame.clientHeight/2)) + 12;
    if (reduced.matches) {
      motion(wordmark,[{opacity:1},{opacity:0}],{startAt,duration:200,easing:'linear'});
      run.style.clipPath = 'none'; motion(run,[{opacity:0},{opacity:1}],{startAt,duration:200,easing:'linear'});
      if (!await wait(200,signal)) return;
    } else {
      motion(wordmark,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.045)'}],{startAt,duration:300,delay:120,easing:'cubic-bezier(.23,1,.32,1)'});
      wash.hidden = false; blue.hidden = false;
      const keys=[{clipPath:'circle(0px at 50% 50%)'},{clipPath:'circle('+radius+'px at 50% 50%)'}];
      motion(wash,keys,{startAt,duration:500,easing:'cubic-bezier(.77,0,.175,1)'});
      motion(blue,keys,{startAt,duration:540,delay:35,easing:'cubic-bezier(.77,0,.175,1)'});
      motion(run,keys,{startAt,duration:580,delay:70,easing:'cubic-bezier(.77,0,.175,1)'});
      if (!await wait(650,signal)) return;
    }
    run.style.clipPath='none'; wash.hidden=true; blue.hidden=true; count.hidden=true; launch.hidden=true; count.inert=false;
    frame.dataset.phase='running'; root.querySelector('.su-home-indicator').style.color='#fff'; announce('자유러닝을 시작했어요');
  }
  async function previewReveal() {
    const signal=reset(); showCountBase(); number.textContent='0';
    await assetsReady; if (signal.aborted) return;
    if (!reduced.matches) motion(sweep,[{transform:'rotate(1080deg)'},{transform:'rotate(1260deg)'}],{duration:500,easing:'linear'});
    if (!await wait(180,signal)) return;
    if (!await showLaunch(signal)) return;
    await reveal(signal);
  }
  async function playAll() {
    showCheck(true,false); const signal=controller.signal;
    if (!await wait(1100,signal)) return; await countdown(true);
  }
  buttons.forEach(b => b.addEventListener('click',() => {
    const view=b.dataset.preview; save(view);
    if(view==='check') showCheck(true,false); else if(view==='count') countdown(false); else if(view==='reveal') previewReveal(); else playAll();
  }));
  root.querySelectorAll('[data-action="cancel"]').forEach(b => b.addEventListener('click', showHome));
  root.querySelector('[data-action="open-check"]').addEventListener('click',() => showCheck(true,true));
  root.querySelector('[data-action="start"]').addEventListener('click',() => { save('all'); countdown(true); });
  root.querySelector('[data-action="stop"]').addEventListener('click',showHome);
  root.querySelector('[data-action="pause"]').addEventListener('click',() => {
    paused=!paused; root.querySelector('.su-pause-label').textContent=paused?'계속 달리기':'일시정지'; root.querySelector('.su-live-label').textContent=paused?'일시정지':'러닝 중'; announce(paused?'러닝을 일시정지했어요':'러닝을 계속해요');
  });
  root.querySelector('[data-action="locate"]').addEventListener('click',() => {
    motion(root.querySelector('.su-position'),[{opacity:.4},{opacity:1}],{duration:200,easing:'linear'});announce('현재 위치를 보고 있어요');
  });
  frame.addEventListener('keydown',e => {
    if(e.key==='Escape'&&frame.dataset.phase!=='running'){e.preventDefault();showHome();return;}
    if(e.key==='Tab'&&!check.hidden){
      const focusable=[...check.querySelectorAll('button')]; const first=focusable[0],last=focusable.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
  window.addEventListener('pagehide',reset,{once:true});
  window.addEventListener('openai:set_globals',event => {
    const state=event.detail?.globals?.widgetState?.privateContent;
    if(state?.view==='check')showCheck(false,false);
  });
  const saved=window.openai?.widgetState?.privateContent?.view;
  if(saved==='reveal'){reset();run.hidden=false;run.style.clipPath='none';root.querySelector('.su-home').inert=true;frame.dataset.phase='running';active('reveal');}
  else if(saved==='check'){showCheck(false,false);}
  else {reset();showCountBase();number.textContent='3';}
})();
</script>
