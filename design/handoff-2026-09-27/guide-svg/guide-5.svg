<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" role="img" aria-label="Prototype / 구현 전달"><g id="Prototype-구현-전달--local-4357" data-layer="Prototype / 구현 전달" transform="translate(0 0)" opacity="1"><rect width="1000" height="478" rx="24" fill="rgb(5,9,17)" stroke="none" stroke-width="0"/><g id="Title--local-4358" data-layer="Title" transform="translate(40 40)" opacity="1"><text fill="rgb(241,243,250)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="500" letter-spacing="-0.6" text-anchor="start"><tspan x="0" y="28.52">Prototype / 구현 전달</tspan></text></g><g id="Guide--local-4359" data-layer="Guide" transform="translate(40 98)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">시작 메뉴의 네 버튼에서 주요 흐름을 확인하세요. 상세 오류·완료 상태는 별도의 REVIEW 프레임에서 열 수 있습니다. 모달은 독립 O</tspan><tspan x="0" y="44.44">verlay 프레임으로 연결했습니다.</tspan></text></g><g id="Guide--local-4360" data-layer="Guide" transform="translate(40 170)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">프로토타입의 숫자 입력·위치 권한·운동 시간·저장은 예시 상태 전환입니다. 실제 입력 검증·OS 권한·위치·운동 추천·저장 처리는 </tspan><tspan x="0" y="44.44">앱 구현이 필요합니다.</tspan></text></g><g id="Guide--local-4361" data-layer="Guide" transform="translate(40 242)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">다이어트 예시: 준비 걷기 3분 + (달리기 1분 + 걷기 2분) × 3회 + 마무리 걷기 3분 = 총 15분. 총 러닝 3분 / 걷기 12분. 키·몸무게는 </tspan><tspan x="0" y="44.44">변화 기록이며, 러닝 경험은 루틴 구성 참고값입니다.</tspan></text></g><g id="Guide--local-4362" data-layer="Guide" transform="translate(40 314)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">45개 화면은 상태 명세입니다. 모달과 카운트다운의 보조 프레임은 모드별 연결을 위해 추가됩니다. 원본 85개 동작 정의는 동봉된 i</tspan><tspan x="0" y="44.44">nteraction-spec.md에 있습니다.</tspan></text></g><g id="Guide--local-4363" data-layer="Guide" transform="translate(40 386)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">이 파일은 연결된 사이트나 앱을 배포하지 않습니다. 원본 시안과 다르게 새 기능을 추가하지 않았습니다. 컴포넌트 API와 화면의 텍</tspan><tspan x="0" y="44.44">스트·수치는 수정할 수 있습니다.</tspan></text></g></g></svg>