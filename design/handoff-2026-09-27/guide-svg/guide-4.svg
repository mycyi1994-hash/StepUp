<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Layout / 작업 규칙"><g id="Layout-작업-규칙--local-4351" data-layer="Layout / 작업 규칙" transform="translate(0 0)" opacity="1"><rect width="1000" height="380" rx="24" fill="rgb(5,9,17)" stroke="none" stroke-width="0"/><g id="Title--local-4352" data-layer="Title" transform="translate(40 40)" opacity="1"><text fill="rgb(241,243,250)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="500" letter-spacing="-0.6" text-anchor="start"><tspan x="0" y="28.52">Layout / 작업 규칙</tspan></text></g><g id="Guide--local-4353" data-layer="Guide" transform="translate(40 98)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">390 × 844 화면 · 좌우 여백 24 · 간격 8 / 12 / 16 / 20 / 24 · 기본 버튼 높이 56 · 카드 반경 16 · 모달 반경 24. 주요 묶음은 Auto L</tspan><tspan x="0" y="44.44">ayout으로 구성합니다.</tspan></text></g><g id="Guide--local-4354" data-layer="Guide" transform="translate(40 170)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">버튼은 행동을 문장으로 표시합니다. 아이콘만으로 기능을 전달하지 않습니다. 경험 선택은 한 항목만 선택하며 체크 상태를 사용합</tspan><tspan x="0" y="44.44">니다.</tspan></text></g><g id="Guide--local-4355" data-layer="Guide" transform="translate(40 242)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">화면의 지도는 편집 가능한 벡터 예시입니다. 실제 지도를 사용한 경로 탐색이나 출발점 길찾기가 아닙니다. 출발과 도착은 현재 위</tspan><tspan x="0" y="44.44">치입니다.</tspan></text></g><g id="Guide--local-4356" data-layer="Guide" transform="translate(40 314)" opacity="1"><text fill="rgb(161,174,195)" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2" text-anchor="start"><tspan x="0" y="18.439999999999998">미측정 거리·페이스는 0이 아닌 — 로 표시합니다. 저장 실패 시 기록을 보존하고, 저장 성공을 확인한 뒤 완료 문구를 표시합니다.</tspan></text></g></g></svg>