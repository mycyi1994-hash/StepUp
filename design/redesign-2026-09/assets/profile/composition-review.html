<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>프로필 레이어 합성 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#0a1226;color:#f3f6ff;font:14px system-ui}h1{font-size:22px;margin:0 0 8px}p{color:#b0bddd;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,300px));gap:20px}.card h2{font-size:16px;margin:0 0 10px}.scene{position:relative;width:300px;height:300px;overflow:hidden;background:#fff;border-radius:16px}.scene.night{background:url('../../../../app/src/main/res/drawable-nodpi/scene_home_blue_night.png') center 60%/cover}.scene.dawn{background:url('../../../../app/src/main/res/drawable-nodpi/scene_home_dawn.png') center 60%/cover}.bench{position:absolute;width:100%;height:66.66667%;left:0;top:28.64583%}.avatar{position:absolute;left:16.66667%;top:0;width:66.66667%;height:100%}.runo .bench{top:31.25%}.stack{display:grid;gap:20px}img{object-fit:contain}
</style>
<h1>프로필 · 독립 레이어 합성</h1><p>앱 캡처가 아닌 자산 배치 확인용. 배경 → 벤치 → 캐릭터. 이름·기록·버튼은 앱에서 별도 표시.</p>
<div class="grid" id="grid"></div>
<script>
for(const gender of ['lumi','runo'])for(const background of ['night','dawn','white']){
 const card=document.createElement('div');card.className='card';
 card.innerHTML=`<h2>${gender.toUpperCase()} · ${background}</h2><div class="scene ${background} ${gender}"><img class="bench" src="bench-riverside-v2.png"><img class="avatar" src="${gender}-seated-pink-v2.png"></div>`;document.querySelector('#grid').append(card);
}
</script>
</html>
