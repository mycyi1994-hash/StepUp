# 매일 이용자 · 활동 숫자(2026-11-24) — 매일 아침 9시 전에 운영 DB 를 읽기만 하고, 숫자를 메신저로 보낸다.
# 사용자 "매일 09:00 기준 실 이용자 수 · 도움될 만한 것 전부". 숫자 만드는 곳은 supabase/maintenance/daily-stats.sql.
#
# 이 저장소는 공개다 — Actions 로그도 누구나 본다. 그래서 숫자는 로그 · 이슈 · 아티팩트에 남기지 않고 비밀 주소로만 보낸다.
# 받는 곳(저장소 Settings › Secrets and variables › Actions — 하나 이상):
#   텔레그램: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID   (봇 만들기는 docs/운영-배포후-할일.md "매일 숫자")
#   디스코드: DISCORD_WEBHOOK_URL
# 빼는 계정: 저장소 변수 STATS_EXCLUDE_EMAILS(운영자 · 시험 계정 이메일, 쉼표로).
# 받는 곳이 없거나 보내지 못하면 작업이 실패한다(실패 메일이 간다 — 숫자는 담지 않는다).
name: Daily stats

on:
  schedule:
    # 23:55 UTC = 08:55 KST — 예약 실행은 몇 분 늦게 뜨기도 해 9시 무렵에 온다
    - cron: '55 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Read and send
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXCLUDE: ${{ vars.STATS_EXCLUDE_EMAILS || '' }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::SUPABASE_DB_URL 이 없어 읽지 못합니다."; exit 1; fi
          if [ -z "$DISCORD_WEBHOOK_URL" ] && { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; }; then
            echo "::error::받는 곳이 없습니다 — TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID 또는 DISCORD_WEBHOOK_URL 을 넣으세요."; exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          # 숫자는 파일에만 — 화면(로그)에 찍지 않는다
          PGCONNECT_TIMEOUT=20 psql "$SUPABASE_DB_URL" -q -v exclude="$EXCLUDE" \
            -f supabase/maintenance/daily-stats.sql > report.md 2> psql-error.txt \
            || { echo "::error::DB 를 읽지 못했습니다."; sed -E 's/[0-9]{2,}/N/g' psql-error.txt | head -5; exit 1; }
          [ -s report.md ] || { echo "::error::결과가 비었습니다."; exit 1; }
          sent=0
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            # 텔레그램은 마크다운 굵게(**)를 모르므로 지우고 보낸다(4,096자 넘으면 자른다)
            text=$(sed 's/\*\*//g; s/^## //' report.md | head -c 4000)
            code=$(curl -s -o tg.json -w '%{http_code}' --max-time 20 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" -d disable_web_page_preview=true)
            if [ "$code" = 200 ]; then sent=$((sent + 1)); echo "텔레그램으로 보냈습니다"; else echo "::warning::텔레그램 보내기 실패 (HTTP $code)"; fi
          fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            body=$(head -c 1900 report.md | jq -Rs '{content: .}')
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H 'content-type: application/json' -d "$body" "$DISCORD_WEBHOOK_URL")
            if [ "$code" = 204 ] || [ "$code" = 200 ]; then sent=$((sent + 1)); echo "디스코드로 보냈습니다"; else echo "::warning::디스코드 보내기 실패 (HTTP $code)"; fi
          fi
          rm -f report.md tg.json
          [ "$sent" -gt 0 ] || { echo "::error::어디로도 보내지 못했습니다."; exit 1; }
