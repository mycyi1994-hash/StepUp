# 서버 스키마 검사.
#
# setup.sql 은 사용자가 대시보드에 직접 붙여넣는 파일이다. 붙여넣고 나서야
# 틀린 것을 알면 이미 늦다 — 반쯤 적용된 데이터베이스를 손으로 되돌려야 한다.
# 여기서 깨끗한 Postgres 에 두 번 올려 보고, 앱과 같은 권한으로 규칙을
# 두드려 본다.
#
# 두 번 올리는 것이 핵심이다. 스키마는 앞으로도 늘어나고, 그때마다 사용자는
# 같은 파일을 다시 붙여넣는다. "다시 붙여넣어도 안전하다"가 깨지면 그때부터
# 스키마 변경은 사용자에게 수작업이 된다.
name: Test server schema

on:
  push:
    branches:
      - "claude/**"
      - "main"
    paths:
      - "supabase/**"
      - "scripts/build-setup-sql.py"
      - "scripts/feed-collect.py"
      - "scripts/check-coaching-twin.py"
      - "scripts/check-economy-twin.py"
      - "tools/economy_sim/**"
      - "app/src/main/java/com/stepup/android/domain/EconomyV4.kt"
      - "coach-worker/**"
      - "app/src/main/java/com/stepup/android/domain/coaching/**"
      - ".github/workflows/test-sql.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    # ubuntu-24.04 로 고정 — run.sh 는 이 이미지에 든 PostgreSQL 16(/usr/lib/postgresql/16/bin)을 쓴다. ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 이다
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup.sql 은 migrations/ 를 이어 붙인 결과물이다. 손으로 고치고
      # 다시 만드는 것을 잊으면, 검사를 통과한 파일과 붙여넣는 파일이 달라진다.
      - name: setup.sql 이 migrations 와 일치하는가
        run: |
          python3 scripts/build-setup-sql.py
          if ! git diff --quiet -- supabase/setup.sql; then
            echo "::error::supabase/setup.sql 이 migrations/ 와 다릅니다. scripts/build-setup-sql.py 를 실행해 다시 만들고 커밋하세요."
            git --no-pager diff --stat -- supabase/setup.sql
            exit 1
          fi

      - name: 스키마 검사
        run: supabase/tests/run.sh

      # 경제 불변식(2026-11-18) — 실제 서버 규칙으로 등급 · 레벨마다 하루를 돌려, 운이 가장 나쁜 날에도 걸어서 남는지 ·
      # 강화하면 덜 남지 않는지 · 새 사용자가 첫 러닝 뒤 고칠 수 있는지 · 갈아 신어도 에너지가 남는지 본다.
      # 0119: 포인트를 네 가지로 나눠서 · 새 사용자가 첫날 기본 목표를 채우는지 · 수리하는 쪽이 늘 나은지 · 예전 앱 강화가 더 싸지 않은지
      - name: 경제 불변식
        run: python3 tools/economy_sim/check.py

      # 강화 경험치(0118) — 설계 모형(forge_xp_model.py)의 통 크기 · 재료 값이 서버 함수와 같은가
      - name: 강화 경험치 모형 = 서버
        run: python3 tools/economy_sim/forge_xp_model.py --check

      # 레벨이 오르는 속도(0119) — 서버 규칙의 통으로 꾸준한 무과금 사용자의 만렙까지 걸리는 날(레어 24일 · 에픽 119일 ±20%).
      # 0118 이 통의 굽이를 바꾸면서 레어 만렙이 24일 → 9일이 된 것을 아무 검사도 잡지 못했다
      - name: 레벨 속도(기준 러너)
        run: python3 tools/economy_sim/pace.py --check

      # 경제 4판 규칙(0116)은 앱에도 있다(서버를 읽기 전의 값) — 서버만 고쳐 앱과 어긋나지 않게
      - name: 경제 쌍둥이(앱 = 서버)
        run: python3 scripts/check-economy-twin.py

      # AI 코칭(0060)의 규칙은 앱에도 있다 — 서버만 고쳐 앱과 어긋나지 않게
      - name: AI 코칭 쌍둥이(앱 = 서버)
        run: python3 scripts/check-coaching-twin.py

      # 수집기의 규칙(허용 도메인·오탐 거르기·이용 범위)은 네트워크 없이
      # 확인할 수 있다. 깨진 채로 한 시간마다 도는 것을 막는다.
      - name: 수집기 규칙 검사
        run: python3 scripts/feed-collect.py --self-test
