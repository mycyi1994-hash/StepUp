name: Native Shoes Remaining Captures
on:
  push:
    branches: [codex/shoes-capture-20261107]
    paths: ['.github/workflows/capture-shoes-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: catalog-fresh
            tests: ShoeCatalogDesignTest#newShoesInTheShoesTab
          - group: draw-signin-fresh
            tests: ShoeDrawTabsDesignTest#signedOutThenLoadFailedInTheApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shoes-capture-apks
          path: capture-apks
          run-id: 42247814249
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture remaining scenes from the identical APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none
          script: bash tools/capture_shoes_native.sh '${{ matrix.group }}' '${{ matrix.tests }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoes-native-${{ matrix.group }}
          path: shoes-captures/
          retention-days: 14
