# iOS 앱(Kotlin Multiplatform 뼈대, 2026-11-02 — docs/ios/README.md).
#
# 공용 규칙(:shared)을 JVM · iOS 시뮬레이터에서 검사하고, Xcode 프로젝트를 만들어 시뮬레이터용 앱을 빌드한다(서명 없음).
# macOS 러너는 비공개 저장소에서 분이 리눅스의 10배로 깎인다 — iOS 쪽 파일이 바뀔 때만 돈다(손으로도 돌릴 수 있다).
# 안드로이드 빌드(build-apk.yml)는 :shared 의 JVM 검사를 따로 돌린다.
name: iOS

on:
  push:
    branches:
      - "claude/**"
      - "main"
    paths:
      - "shared/**"
      - "sharedData/**"
      - "sharedUi/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "shared/**"
      - "sharedData/**"
      - "sharedUi/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # App Store 는 Xcode 26 · iOS 26 SDK 로 만든 빌드만 받는다(2026-04 부터) — Kotlin 2.3 에 맞춰 Xcode 26 중 가장 새 판을 쓴다(2026-11-02).
      # 판 번호 없는 이름(Xcode_26.app)보다 번호 있는 판을 먼저 찾는다 — 번호 없는 Xcode_16.app 은 맞는 시뮬레이터 런타임이 없었다(2026-11-02).
      - name: Pick Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -t. -k2 -n | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1)
          if [ -z "$XCODE" ]; then echo "러너에 Xcode 26 이 없다"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          # 시뮬레이터 하나를 정해 검사 · 실행 캡처가 같은 기기를 쓴다(iPhone 17 이 없으면 16)
          SIM=$(xcrun simctl list devices available | grep -m1 -E "iPhone 17 \(" | grep -oE "[0-9A-F-]{36}" || true)
          [ -n "$SIM" ] || SIM=$(xcrun simctl list devices available | grep -m1 -E "iPhone 16 \(" | grep -oE "[0-9A-F-]{36}")
          echo "IOS_SIM=$SIM" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -20

      - name: Shared rules tests (JVM · iOS simulator)
        run: ./gradlew :shared:jvmTest :shared:iosSimulatorArm64Test :sharedData:iosSimulatorArm64Test -Pstepup.iosTestDevice="$IOS_SIM" --stacktrace

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build app for iOS simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/StepUp.xcodeproj \
            -scheme StepUp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      # 빌드만으로는 모른다 — 시뮬레이터에 깔아 띄우고 화면을 찍는다. Compose 화면이 뜨다 멈추면(충돌 기록이 남으면) 실패
      # 빌드만으로는 모른다 — 시뮬레이터에 깔아 띄우고 화면을 찍는다. Compose 화면이 뜨다 멈추면(충돌 기록이 남으면) 실패.
      # 2026-11-02 Xcode 26 첫 실행: iOS 26 시뮬레이터 부팅(simctl)이 아무 출력 없이 34분 멈춰 작업 시간 제한에 잘렸다 —
      # 부팅마다 8분 제한을 두고, 안 되면 iOS 18 iPhone 16 으로 넘어간다. 단계마다 줄을 남겨 어디서 멈췄는지 보이게 한다.
      - name: Launch on simulator and capture
        timeout-minutes: 25
        run: |
          APP=iosApp/build/Build/Products/Debug-iphonesimulator/StepUp.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          # 시간 제한 실행(macOS 에는 timeout 이 없다)
          limit() { perl -e 'alarm shift @ARGV; exec @ARGV or die "exec: $!"' "$@"; }
          # 고를 기기 차례: iOS 26 iPhone 17 → iOS 18 iPhone 16
          CANDIDATES=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          order = []
          for runtime_prefix, name_prefix in (("iOS-26", "iPhone 17"), ("iOS-18", "iPhone 16")):
              for rt in sorted((r for r in devs if runtime_prefix in r), reverse=True):
                  for d in devs[rt]:
                      if d["name"].startswith(name_prefix) and d["isAvailable"]:
                          order.append(rt.split(".")[-1] + " " + d["name"].replace(" ", "_") + " " + d["udid"])
                          break
                  else:
                      continue
                  break
          print("\n".join(order))')
          echo "후보:"; echo "$CANDIDATES"
          xcrun simctl shutdown all || true
          DEVICE=""
          while read -r RUNTIME NAME UDID; do
            [ -n "$UDID" ] || continue
            echo "부팅: $NAME ($RUNTIME) $UDID"
            if limit 480 xcrun simctl bootstatus "$UDID" -b; then DEVICE="$UDID"; break; fi
            echo "부팅이 8분 안에 끝나지 않았다 — 다음 기기로"
            limit 60 xcrun simctl shutdown "$UDID" || true
          done <<< "$CANDIDATES"
          if [ -z "$DEVICE" ]; then echo "띄울 시뮬레이터가 없다"; exit 1; fi
          echo "설치"; limit 300 xcrun simctl install "$DEVICE" "$APP"
          echo "실행"; limit 120 xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 10
          echo "화면 찍기"; limit 60 xcrun simctl io "$DEVICE" screenshot ios-launch.png
          if ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i stepup; then echo "앱이 멈췄다(충돌 기록)"; exit 1; fi

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-screenshot
          path: ios-launch.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-ios-simulator
          path: iosApp/build/Build/Products/Debug-iphonesimulator/StepUp.app
          if-no-files-found: error
          retention-days: 7
