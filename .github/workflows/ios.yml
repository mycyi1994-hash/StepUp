# iOS 앱(Kotlin Multiplatform 뼈대, 2026-11-02 — docs/ios/README.md).
#
# 공용 규칙(:shared)을 JVM · iOS 시뮬레이터에서 검사하고, Xcode 프로젝트를 만들어 시뮬레이터용 앱을 빌드한다(서명 없음).
# macOS 러너는 비공개 저장소에서 분이 리눅스의 10배로 깎인다 — iOS 쪽 파일이 바뀔 때만 돈다(손으로도 돌릴 수 있다).
# 안드로이드 빌드(build-apk.yml)는 :shared 의 JVM 검사를 따로 돌린다.
name: iOS

on:
  push:
    branches:
      - "claude/**"
      - "main"
    paths:
      - "shared/**"
      - "sharedUi/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "shared/**"
      - "sharedUi/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Kotlin 2.0.21 은 Xcode 16 까지와 맞춰 나왔다. 러너에 있는 Xcode 16 중 가장 새 것을 쓴다(없으면 러너 기본값).
      # App Store 제출은 Xcode 26 이 필요하다 — Kotlin 을 올리는 단계에서 이 줄을 Xcode 26 으로 바꾼다(docs/ios/README.md).
      - name: Pick Xcode 16
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -20

      - name: Shared rules tests (JVM · iOS simulator)
        run: ./gradlew :shared:jvmTest :shared:iosSimulatorArm64Test --stacktrace

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build app for iOS simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/StepUp.xcodeproj \
            -scheme StepUp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-ios-simulator
          path: iosApp/build/Build/Products/Debug-iphonesimulator/StepUp.app
          if-no-files-found: error
          retention-days: 7
