name: Screen Gallery Capture
on:
  push:
    branches: ["codex/screen-captures-20260924", "codex/stepup-cohesive-redesign"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build capture APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Capture every screen and inner tab
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu software -camera-back none
          script: |
            adb shell settings put system system_locales ko-KR
            bash tools/run_screen_gallery.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StepUp-screen-gallery-api-${{ matrix.api-level }}
          path: |
            screen-gallery/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
