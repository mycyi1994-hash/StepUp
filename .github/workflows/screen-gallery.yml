name: Screen Gallery Capture
on:
  # 손으로만 돈다 — 9월에 멈춘 작업 브랜치(codex/screen-captures-20260924 · codex/stepup-cohesive-redesign)의 푸시 트리거는 뺐다
  workflow_dispatch:
    inputs:
      scope:
        description: Capture the character-free redesign or the full regression gallery
        type: choice
        options: [redesign, secondary, records, explore, wardrobe, mystery, gallery, interaction, all]
        default: redesign
permissions:
  contents: read
jobs:
  capture:
    # ubuntu-24.04 로 고정 — 에뮬레이터 설정(KVM · 메모리)은 이 이미지에서만 확인했다. ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 이다
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
        suite: ${{ fromJSON(github.event.inputs.scope == 'all' && '["interaction", "gallery", "large-font", "permissions"]' || github.event.inputs.scope == 'interaction' && '["interaction"]' || github.event.inputs.scope == 'gallery' && '["gallery"]' || github.event.inputs.scope == 'mystery' && '["mystery"]' || github.event.inputs.scope == 'wardrobe' && '["wardrobe"]' || github.event.inputs.scope == 'secondary' && '["secondary"]' || github.event.inputs.scope == 'records' && '["records"]' || github.event.inputs.scope == 'explore' && '["explore"]' || '["redesign"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build capture APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Capture every screen and inner tab
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none
          script: |
            adb shell settings put system system_locales ko-KR
            if [ "${{ matrix.suite }}" = "wardrobe" ] || [ "${{ matrix.suite }}" = "gallery" ]; then adb shell wm size 1080x2400; fi
            bash tools/run_screen_gallery.sh ${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: StepUp-screen-gallery-api-${{ matrix.api-level }}-${{ matrix.suite }}
          path: |
            screen-gallery/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
