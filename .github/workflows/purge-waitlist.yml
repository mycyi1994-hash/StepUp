name: Purge expired waitlist data

on:
  schedule:
    - cron: '13 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove expired records
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WAITLIST_LAUNCH_DATE: ${{ vars.WAITLIST_LAUNCH_DATE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is missing; waitlist retention cleanup cannot run."
            exit 1
          fi
          if [ -n "$WAITLIST_LAUNCH_DATE" ] && [[ ! "$WAITLIST_LAUNCH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::WAITLIST_LAUNCH_DATE must use YYYY-MM-DD."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          PGCONNECT_TIMEOUT=20 psql "$SUPABASE_DB_URL" -v launch_date="$WAITLIST_LAUNCH_DATE" -f supabase/maintenance/purge-waitlist.sql
