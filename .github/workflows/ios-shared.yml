# 공용 모듈(shared)이 아이폰에서도 컴파일되고 공용 검사가 아이폰 시뮬레이터에서 통과하는지 본다.
#
# 아이폰 컴파일은 Mac 에서만 된다(리눅스 CI 는 건너뛴다). Mac 러너는 비공개 저장소에서 사용 시간이 리눅스의 10배로
# 세지므로 shared 코드나 빌드 설정이 바뀔 때만 돈다. 계획: docs/ios-plan-2026-11-04.md
name: iOS shared

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios-shared.yml"
  pull_request:
    paths:
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios-shared.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native 컴파일러(약 300MB)를 판마다 한 번만 받는다
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # 아이폰(기기) 컴파일 + 시뮬레이터에서 commonTest
      - name: Compile for iPhone and test on simulator
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:iosSimulatorArm64Test --stacktrace
