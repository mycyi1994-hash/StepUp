name: Experience QA

on:
  pull_request:
  push:
    branches: ["codex/release-readiness", "claude/quirky-rubin-dwm6yv"]
  workflow_dispatch:

permissions:
  # 브랜치 푸시·수동 실행 때 검토용 화면 캡처를 qa-captures 사전 배포에 올린다
  # (아래 마지막 단계). 풀 리퀘스트 실행에서는 쓰기를 하지 않는다.
  contents: write

concurrency:
  group: experience-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit tests, lint and release compilation
        run: |
          python tools/check_experience_assets.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Device interaction and screenshot coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Screen Gallery Capture 와 같은 에뮬레이터 설정 — 리디자인 테스트가 이 설정에서 검증됐다
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none
          script: bash tools/run_device_qa.sh
      # 검토용 화면 캡처 — 브랜치 푸시와 수동 실행에서만. 풀 리퀘스트에서는 올리지 않는다.
      #
      # 아티팩트는 로그인해야 받을 수 있지만, 사전 배포의 첨부 파일은 테스트 APK 와
      # 같은 방식으로 누구나 받는다. 전부(수백 장)가 아니라 한국어 기본·큰 글자,
      # 다크·라이트 한 벌과 하단 탭 이동 캡처, 레이아웃 검사 기록만 묶는다.
      - name: Publish review screenshots
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p review
          for f in qa-captures/ko-dark-normal-*.png qa-captures/ko-light-normal-*.png \
                   qa-captures/ko-dark-large-*.png qa-captures/navigation-*.png \
                   qa-captures/ref-*.png qa-captures/ref-audit.jsonl; do
            if [ -f "$f" ]; then cp "$f" review/; fi
          done
          cp qa-captures/layout-audit.jsonl qa-captures/android-crashes.txt review/ 2>/dev/null || true
          count=$(ls review | wc -l)
          echo "review files: $count"
          [ "$count" -gt 0 ] || exit 0
          (cd review && zip -q ../qa-review.zip ./*)
          if ! gh release view qa-captures >/dev/null 2>&1; then
            gh release create qa-captures --prerelease --target "$GITHUB_SHA" \
              --title "QA 화면 캡처" \
              --notes "Experience QA 가 에뮬레이터에서 찍은 실제 화면. 수동 실행 때마다 덮어쓴다."
          fi
          # 파일 목록에 이미 지워진 파일이 남아 있으면 --clobber 가 404 로 끝난다 —
          # 그때는 사전 배포를 새로 만든다(태그 qa-captures 는 그대로라 주소는 같다)
          if ! gh release upload qa-captures qa-review.zip --clobber; then
            gh release delete qa-captures --yes
            gh release create qa-captures qa-review.zip --prerelease \
              --title "QA 화면 캡처" \
              --notes "Experience QA 가 에뮬레이터에서 찍은 실제 화면. 수동 실행 때마다 덮어쓴다."
          fi
          gh release edit qa-captures --notes "Experience QA 캡처 · ${GITHUB_REF_NAME} · ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StepUp-experience-qa
          path: |
            qa-captures/
            screen-gallery/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/app-debug.apk
