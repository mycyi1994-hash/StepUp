name: Build APK

on:
  push:
    branches:
      - "claude/**"
      - "codex/stepup-cohesive-redesign"
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 컴파일 오류는 Gradle 스택트레이스 수백 줄에 파묻힌다. 출력을 남겨 두고
      # 실패했을 때 정작 읽어야 할 'e:' 줄만 뽑아 요약에 올린다.
      # 안드로이드 리소스 문법은 빌드 7분을 쓴 뒤에야 터진다. 1초에 끝나는
      # 검사를 앞에 둬서 그 7분을 아낀다.
      - name: Check string resources
        run: python3 scripts/check-strings.py

      - name: Check shared design contract
        run: python3 tools/check_design_contract.py

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee -a build-output.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a build-output.log

      # 고정 키스토어로 서명됐는지 확인한다. 지문이 빌드마다 달라지면
      # 기기에 이미 설치된 앱을 덮어쓸 수 없다(INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      - name: Verify APK signature is stable
        run: |
          set -euo pipefail
          EXPECTED=$(keytool -list -v -keystore app/debug.keystore -storepass android \
            | grep 'SHA256:' | head -1 | tr -d ' ')
          ACTUAL=$(keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk \
            | grep 'SHA256:' | head -1 | tr -d ' ')
          echo "keystore : $EXPECTED"
          echo "apk      : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK가 고정 debug 키스토어로 서명되지 않았습니다."
            exit 1
          fi
          echo "✓ 서명 일치 — 이전 빌드 위에 업데이트 설치 가능"

      # R8이 켜져 있으므로 release 빌드가 컴파일되는지 매 푸시마다 확인한다.
      # 서명 자격이 없어도 빌드 자체는 되어야 한다 — 난독화 문제를 출시
      # 직전이 아니라 지금 발견하는 것이 목적이다.
      - name: Build release (unsigned, R8 on)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee -a build-output.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.log
          retention-days: 7

      # 실패 원인을 한눈에.
      #
      # 컴파일 오류만 잡으면 안 된다 — 의존성을 못 찾거나 설정이 잘못된 경우가
      # 그만큼 흔하고, 그때는 'e:' 줄이 아예 없어서 로그가 비어 보인다.
      # Gradle 이 실패를 설명하는 줄까지 같이 뽑는다.
      - name: Surface build errors
        if: failure()
        run: |
          PATTERN='^e: |^> Task .* FAILED|What went wrong|Could not (find|resolve|determine|create)|^Caused by|error: |Execution failed|Unresolved reference'
          {
            echo "## 빌드 실패 원인"
            echo
            echo '```'
            grep -E "$PATTERN" build-output.log | head -40 \
              || echo "(원인 줄을 찾지 못했습니다 — 아티팩트의 전체 로그를 확인하세요)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "───────── 빌드 실패 원인 ─────────"
          grep -E "$PATTERN" build-output.log | head -40 || echo "(원인 줄 없음)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 폰에서 주소 하나로 바로 받을 수 있게 릴리스에 붙인다.
      #
      # 위의 아티팩트는 깃허브에 로그인해 zip 을 받아 풀어야 한다. 폰에서
      # 하기에는 번거롭고, 테스트해 달라고 부탁하는 입장에서 그 번거로움은
      # 그대로 "안 해 봤어요"가 된다.
      #
      # 태그는 test-apk 하나로 고정한다. 주소가 매번 바뀌면 받는 사람이
      # 어디서 받아야 하는지 매번 물어야 한다.
      #
      # main 에 들어간 것만 올린다. 작업 브랜치마다 올리면 여러 브랜치가 같은
      # 주소를 번갈아 덮어써서, 받을 때마다 다른 브랜치의 앱(예전 디자인)이 나온다.
      # 작업 브랜치의 APK 는 위의 아티팩트에서 받는다.
      - name: Publish test APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          SHORT=${GITHUB_SHA:0:7}
          cp app/build/outputs/apk/debug/app-debug.apk StepUp-test.apk

          # 서명 지문은 공개 값이다. 구글 클라우드에 등록한 값과 맞는지
          # 받는 사람이 바로 대조할 수 있게 적어 둔다 — 여기가 어긋나면
          # 앱은 멀쩡히 깔리는데 구글 로그인만 조용히 실패한다.
          SHA1=$(keytool -list -v -keystore app/debug.keystore -storepass android \
            | grep 'SHA1:' | head -1 | sed 's/.*SHA1: //')

          cat > notes.md <<EOF
          **StepUp ${VERSION}** · 테스트용 디버그 빌드

          | | |
          |---|---|
          | 브랜치 | \`${GITHUB_REF_NAME}\` |
          | 커밋 | \`${SHORT}\` |
          | 빌드(UTC) | $(date -u '+%Y-%m-%d %H:%M') |
          | 패키지 | \`com.stepup.android\` |
          | 서명 SHA-1 | \`${SHA1}\` |

          ## 설치

          폰 브라우저에서 아래 \`StepUp-test.apk\` 를 받아 여세요.
          처음이면 "출처를 알 수 없는 앱 설치"를 한 번 허용해야 합니다.

          > 디버그 빌드입니다. 스토어에 올릴 빌드가 아니라 동작을 보기 위한 것입니다.
          > 이 파일은 푸시할 때마다 같은 주소에서 최신으로 바뀝니다.
          EOF

          # 릴리스를 통째로 지우고 다시 만든다. 파일만 바꿔 끼우면(--clobber),
          # 올리다 끊긴 파일이 GitHub 에 반쯤 남아 목록에는 안 보이면서 같은 이름을
          # 막는 일이 생긴다 — 그러면 지워지지도 않고 422(ReleaseAsset.name already
          # exists)만 계속 난다. 태그(test-apk)는 남기므로 받는 주소는 그대로다.
          if gh release view test-apk >/dev/null 2>&1; then
            gh release delete test-apk --yes
          fi
          gh release create test-apk StepUp-test.apk \
            --prerelease \
            --title "테스트 APK — ${VERSION} (${SHORT})" \
            --notes-file notes.md

          {
            echo "### 테스트 APK 받는 곳"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/test-apk/StepUp-test.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      # 컨테이너/사용자가 git으로 바로 받아갈 수 있도록 APK를 배포 전용 브랜치에 커밋한다.
      # 배포 브랜치는 하나여야 한다. 개발 브랜치 푸시가 apk-dist를 덮어쓰면
      # README의 다운로드 링크가 검증되지 않은 빌드를 가리키게 된다.
      - name: Publish APK to apk-dist branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist/StepUp-debug.apk
          # 예전 링크(StrideUp-debug.apk)를 공유한 곳이 있어 같은 파일을 옛 이름으로도 남긴다
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist/StrideUp-debug.apk
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "${GITHUB_WORKSPACE}/app/build.gradle.kts" | head -1 || true)
          VERSION=${VERSION:-unknown}
          cd /tmp/dist
          {
            echo "# StepUp APK 배포 브랜치"
            echo
            echo "CI가 빌드한 디버그 APK가 커밋됩니다. 최신 빌드 직접 링크:"
            echo
            echo '```'
            echo "https://github.com/${GITHUB_REPOSITORY}/raw/apk-dist/StepUp-debug.apk"
            echo '```'
            echo
            echo "- 버전: ${VERSION}"
            echo "- 원본 커밋: ${GITHUB_SHA}"
            echo "- 빌드 시각(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "\`StrideUp-debug.apk\`는 예전 이름으로 남겨둔 동일한 파일입니다."
          } > README.md
          git init -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "StepUp debug APK ${VERSION} (${GITHUB_SHA:0:7})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
