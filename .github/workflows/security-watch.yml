# 보안 감시(2026-11-02) — 한 시간마다 서버를 읽기만 하고, 이상한 움직임이 있으면 GitHub 이슈로 알린다.
# 이슈는 저장소 주인에게 메일 알림이 간다. 같은 날 열린 이슈가 있으면 새로 만들지 않고 댓글로 덧붙인다.
#   대기 명단 등록 몰림 · 횟수 제한에 걸린 곳 · 접속 코드 무작위 대입 · 새 계정 몰림 · 운영자 함수 사용(supabase/maintenance/security-watch.sql)
#   체인 기록 전송 지갑 잔액 부족
# 기준값은 저장소 변수(Settings › Variables)로 바꾼다 — 없으면 아래 기본값.
name: Security watch

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read server signals
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WAITLIST_HOUR: ${{ vars.WATCH_WAITLIST_HOUR || '40' }}
          SIGNUP_HOUR: ${{ vars.WATCH_SIGNUP_HOUR || '30' }}
          ACCESS_FAIL_HOUR: ${{ vars.WATCH_ACCESS_FAIL_HOUR || '10' }}
          RELAYER: '0x307FD2D78cDD62eaAA61FbC3fB5FF3677F868DC8'
          RELAYER_MIN_WEI: ${{ vars.WATCH_RELAYER_MIN_WEI || '5000000000000000' }}
        run: |
          set -euo pipefail
          : > findings.txt
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is missing; security watch cannot read the server."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          # 서버를 읽지 못하면 작업이 실패한다(조용히 넘어가지 않는다 — 실패 메일이 간다)
          PGCONNECT_TIMEOUT=20 psql "$SUPABASE_DB_URL" -q \
            -v waitlist_hour="$WAITLIST_HOUR" -v signup_hour="$SIGNUP_HOUR" -v access_fail_hour="$ACCESS_FAIL_HOUR" \
            -f supabase/maintenance/security-watch.sql > signals.txt
          grep -E '^[a-z_]+\|' signals.txt >> findings.txt || true
          # 체인 기록 전송 지갑 — 잔액이 떨어지면 기록이 멈춘다(워커는 0.003 ETH 아래면 보내지 않는다)
          hex=$(curl -s --max-time 20 https://sepolia-rpc.giwa.io -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$RELAYER\",\"latest\"]}" | jq -r '.result // empty')
          if [ -n "$hex" ]; then
            wei=$(python3 -c "print(int('$hex', 16))")
            if python3 -c "import sys; sys.exit(0 if $wei < int('$RELAYER_MIN_WEI') else 1)"; then
              echo "relayer_low|체인 기록 전송 지갑 잔액 $(python3 -c "print(round($wei/1e18, 5))") ETH — 충전이 필요해요" >> findings.txt
            fi
          fi
          echo "findings:"; cat findings.txt
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ -s findings.txt ] || { echo "조용함 — 알릴 것 없음"; exit 0; }
          day=$(TZ=Asia/Seoul date +%Y-%m-%d)
          now=$(TZ=Asia/Seoul date '+%m-%d %H:%M')
          {
            echo "**보안 감시 $now (한국 시간)**"
            echo
            while IFS='|' read -r kind detail; do echo "- \`$kind\` $detail"; done < findings.txt
            echo
            echo "운영자 함수 사용(\`admin_action\`)이 내가 한 것이 아니면 바로 확인하세요. 기준값은 Settings › Variables 의 \`WATCH_*\`."
          } > body.md
          gh label create security-alert --color B60205 --description "보안 감시 알림" --force >/dev/null 2>&1 || true
          title="보안 감시 $day"
          number=$(gh issue list --label security-alert --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            printf '\n@%s\n' "$OWNER" >> body.md
            gh issue create --title "$title" --label security-alert --body-file body.md
          fi
