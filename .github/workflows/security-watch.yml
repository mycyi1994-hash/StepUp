# 보안 감시(2026-11-02) — 한 시간마다 서버를 읽기만 하고, 이상한 움직임이 있으면 메신저(텔레그램 / 디스코드)로 알린다.
# 2026-11-24: 저장소가 공개라(GASOK 제출) 예전 security-alert 이슈 · 로그에 내용을 남기지 않는다 — 받는 곳이 없으면 작업이 실패한다(실패 메일엔 내용 없음).
#   대기 명단 등록 몰림 · 횟수 제한에 걸린 곳 · 접속 코드 무작위 대입 · 새 계정 몰림 · 운영자 함수 사용(supabase/maintenance/security-watch.sql)
#   체인 기록 전송 지갑 잔액 부족
# 기준값은 저장소 변수(Settings › Variables)로 바꾼다 — 없으면 아래 기본값.
name: Security watch

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    # 운영 비밀은 이 환경에만(main 전용 — Settings › Environments, 2026-11-24 보안 점검)
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read server signals
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WAITLIST_HOUR: ${{ vars.WATCH_WAITLIST_HOUR || '40' }}
          SIGNUP_HOUR: ${{ vars.WATCH_SIGNUP_HOUR || '30' }}
          ACCESS_FAIL_HOUR: ${{ vars.WATCH_ACCESS_FAIL_HOUR || '10' }}
          RELAYER: '0x307FD2D78cDD62eaAA61FbC3fB5FF3677F868DC8'
          RELAYER_MIN_WEI: ${{ vars.WATCH_RELAYER_MIN_WEI || '5000000000000000' }}
        run: |
          set -euo pipefail
          : > findings.txt
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is missing; security watch cannot read the server."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          # 서버를 읽지 못하면 작업이 실패한다(조용히 넘어가지 않는다 — 실패 메일이 간다)
          PGCONNECT_TIMEOUT=20 psql "$SUPABASE_DB_URL" -q \
            -v waitlist_hour="$WAITLIST_HOUR" -v signup_hour="$SIGNUP_HOUR" -v access_fail_hour="$ACCESS_FAIL_HOUR" \
            -f supabase/maintenance/security-watch.sql > signals.txt 2> psql-error.txt \
            || { echo "::error::서버를 읽지 못했습니다(오류 내용은 공개 로그에 남기지 않는다)"; exit 1; }
          grep -E '^[a-z_]+\|' signals.txt >> findings.txt || true
          # 체인 기록 전송 지갑 — 잔액이 떨어지면 기록이 멈춘다(워커는 0.003 ETH 아래면 보내지 않는다)
          hex=$(curl -s --max-time 20 https://sepolia-rpc.giwa.io -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$RELAYER\",\"latest\"]}" | jq -r '.result // empty')
          # 바깥 RPC 의 답은 믿지 않는다 — 16진수만 받고, 값은 코드에 끼우지 않고 인자로 넘긴다(2026-11-24 보안 점검)
          if [[ "$hex" =~ ^0x[0-9a-fA-F]{1,64}$ ]] && [[ "$RELAYER_MIN_WEI" =~ ^[0-9]{1,40}$ ]]; then
            if python3 -c 'import sys; sys.exit(0 if int(sys.argv[1], 16) < int(sys.argv[2]) else 1)' "$hex" "$RELAYER_MIN_WEI"; then
              eth=$(python3 -c 'import sys; print(round(int(sys.argv[1], 16) / 1e18, 5))' "$hex")
              echo "relayer_low|체인 기록 전송 지갑 잔액 $eth ETH — 충전이 필요해요" >> findings.txt
            fi
          fi
          # 저장소가 공개라 Actions 로그도 공개다 — 내용도 건수도 찍지 않는다
      - name: Send the alert (messenger only)
        # 공개 저장소 — 이슈 · 로그에 남기지 않고 텔레그램 / 디스코드 비밀로만 보낸다(2026-11-24, 예전엔 security-alert 이슈).
        # 받는 곳은 매일 숫자와 같은 비밀(TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID / DISCORD_WEBHOOK_URL). 없으면 작업을 실패로 — 실패 메일에는 내용이 없다
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -s findings.txt ] || { echo "조용함 — 알릴 것 없음"; exit 0; }
          now=$(TZ=Asia/Seoul date '+%m-%d %H:%M')
          {
            echo "보안 감시 $now (한국 시간)"
            echo
            while IFS='|' read -r kind detail; do echo "- $kind: $detail"; done < findings.txt
            echo
            echo "운영자 함수 사용(admin_action)이 내가 한 것이 아니면 바로 확인하세요. 기준값은 Settings › Variables 의 WATCH_*."
          } > body.txt
          sent=0
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(head -c 4000 body.txt)" -d disable_web_page_preview=true)
            if [ "$code" = 200 ]; then sent=$((sent + 1)); else echo "::warning::텔레그램 보내기 실패 (HTTP $code)"; fi
          fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H 'content-type: application/json' \
              -d "$(head -c 1900 body.txt | jq -Rs '{content: .}')" "$DISCORD_WEBHOOK_URL")
            if [ "$code" = 204 ] || [ "$code" = 200 ]; then sent=$((sent + 1)); else echo "::warning::디스코드 보내기 실패 (HTTP $code)"; fi
          fi
          rm -f body.txt findings.txt
          [ "$sent" -gt 0 ] || { echo "::error::알림을 보낼 곳이 없습니다 — TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID 또는 DISCORD_WEBHOOK_URL 을 넣으세요(내용은 여기 남기지 않는다)."; exit 1; }
