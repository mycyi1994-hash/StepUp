name: Emulator crash diag
# 임시(2026-11-04) — 기기 검사 에뮬레이터가 크루 명함 상세에서 러너 쪽 Segmentation fault 로 죽는 까닭을 찾는다.
# 그 검사 하나만 돌리고, 죽은 에뮬레이터의 core dump 콜스택(gdb)과 죽기 직전 기기 로그를 남긴다. 까닭을 찾으면 지운다.
on:
  push:
    branches: [claude/android-shared-ui]
    paths: [.github/workflows/emulator-crash-diag.yml, tools/emulator_crash_diag.sh]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          pkill -f KotlinCompileDaemon || true
          ./gradlew --stop
      - name: Enable KVM and core dumps
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -q gdb > /dev/null
          echo "old core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p
          # 이 뒤 단계(에뮬레이터 실행기)는 Runner.Worker 의 자식 — 그 한도를 물려받는다
          for p in $(pgrep -f Runner.Worker) $(pgrep -f Runner.Listener); do sudo prlimit --pid "$p" --core=unlimited:unlimited || true; done
      - name: Run crew card detail on emulator
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          cores: 4
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan -camera-back none
          script: bash tools/emulator_crash_diag.sh
      - name: Core dump backtrace
        if: always()
        run: |
          ls -la /tmp/cores || true
          emu="${ANDROID_HOME:-/usr/local/lib/android/sdk}/emulator"
          for core in /tmp/cores/core.*; do
            [ -f "$core" ] || continue
            exe=$(find "$emu" -type f -name 'qemu-system-x86_64*' | head -1)
            echo "== $core ($exe)"
            sudo gdb -batch -q -ex "set pagination off" -ex "info sharedlibrary" -ex "bt 40" -ex "thread apply all bt 25" "$exe" "$core" 2>&1 | head -600
          done
          tail -120 diag/device-live-logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-crash-diag
          path: diag/
          retention-days: 3
