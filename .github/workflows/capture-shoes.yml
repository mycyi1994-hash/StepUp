name: Native Shoes Capture
on:
  push:
    branches: [codex/shoes-capture-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate resources and design contract
        run: |
          python3 scripts/check-strings.py
          python3 scripts/check-copy.py
          python3 tools/check_design_contract.py
      - name: Build unchanged app and capture tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: shoes-capture-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
  capture:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - group: my-shoes
            tests: MyShoesDesignTest#inTheAppAtDeviceSizes,MyShoesDesignTest#scenes
          - group: linked
            tests: MyShoesDesignTest#renameAndLinkedDestinations,ShoeCatalogDesignTest
          - group: detail-flow
            tests: ShoeDetailDesignTest#wearFlowInTheApp
          - group: detail-states
            tests: ShoeDetailDesignTest#detailScenes
          - group: repair
            tests: ShoeCareDesignTest
          - group: upgrade
            tests: ShoeUpgradeDesignTest
          - group: draw-flow
            tests: ShoeDrawTabsDesignTest#inTheApp,ShoeDrawTabsDesignTest#inTheAppStates,ShoeDrawTabsDesignTest#signedOutThenLoadFailedInTheApp
          - group: draw-states
            tests: ShoeDrawTabsDesignTest#scenes
          - group: draw-sizes
            tests: ShoeDrawTabsDesignTest#fitsAtDeviceSizes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shoes-capture-apks
          path: capture-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture native screens on a fresh Android device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none
          script: bash tools/capture_shoes_native.sh '${{ matrix.group }}' '${{ matrix.tests }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoes-native-${{ matrix.group }}
          path: shoes-captures/
          retention-days: 14
