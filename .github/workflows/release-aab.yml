# Play Console 업로드용 서명된 AAB를 만든다.
#
# 서명 자격(RELEASE_KEYSTORE_BASE64 외 3개)이 저장소 시크릿에 없으면
# 서명 단계를 건너뛰고 서명되지 않은 AAB만 만든다 — 시크릿을 넣기 전에도
# 파이프라인이 도는지 확인할 수 있어야 하기 때문이다.
#
# 시크릿 등록 방법: docs/RELEASE-SIGNING.md
name: Release AAB

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 릴리즈로 나가는 빌드는 테스트를 통과해야 한다.
      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      # secrets 컨텍스트는 job 수준 if 에서 못 쓰므로, 여기서 한 번 확인해
      # 뒤 단계들이 참조할 출력으로 남긴다.
      - name: Check signing credentials
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✓ 릴리즈 서명 자격 확인 — 서명된 AAB를 만듭니다"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::서명 시크릿이 없어 서명되지 않은 AAB만 만듭니다. docs/RELEASE-SIGNING.md 참고"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/signing/upload.jks"
          # 복호화가 실제로 키스토어를 만들었는지 확인한다. base64가 깨져 있으면
          # 여기서 잡지 않으면 한참 뒤 서명 단계에서 알기 어려운 오류가 난다.
          # 비밀번호는 스크립트 글자에 넣지 않고 환경 변수 이름으로 넘긴다(:env — 명령줄 인자에도 남지 않는다).
          keytool -list -keystore "${RUNNER_TEMP}/signing/upload.jks" \
            -storepass:env RELEASE_KEYSTORE_PASSWORD > /dev/null
          echo "✓ 키스토어 복호화 확인"

      - name: Build AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.ready == 'true' && format('{0}/signing/upload.jks', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Verify the AAB is signed
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          # AAB 안에 서명 블록이 들어갔는지 확인한다. 서명되지 않은 번들을
          # Play Console에 올리면 업로드 자체가 거부된다.
          if unzip -l "$AAB" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC"; then
            echo "✓ AAB 서명 확인"
          else
            echo "::error::AAB가 서명되지 않았습니다."
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # 난독화된 스택트레이스를 되돌리려면 매핑 파일이 반드시 필요하다.
      # 이 파일을 잃으면 그 버전의 크래시 로그는 영원히 못 읽는다.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error
