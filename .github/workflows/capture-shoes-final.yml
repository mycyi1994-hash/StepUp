name: Native Shoes Supplemental Screens
on:
  push:
    branches: [codex/shoes-capture-20261107]
    paths: ['.github/workflows/capture-shoes-final.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and build capture APKs
        run: |
          python3 scripts/check-strings.py
          python3 tools/check_design_contract.py
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --max-workers=2
          ./gradlew --stop
          mkdir -p capture-apks
          cp app/build/outputs/apk/debug/app-debug.apk capture-apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk capture-apks/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture remaining native states and detail scroll position
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none
          script: bash tools/capture_shoes_native.sh supplemental 'ShoeDrawTabsDesignTest#signedOutAndLoadFailureScenes,ShoeDetailDesignTest#careActionsInApp'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoes-native-supplemental
          path: shoes-captures/
          retention-days: 14
