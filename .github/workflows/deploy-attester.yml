# 어테스터 워커 자동 배포.
#
# 지금까지는 attester/ 를 고친 PR 을 합친 뒤 사람이 `npx wrangler deploy` 를 돌려야 했다.
# main 에 합쳐지면 여기서 대신 올린다. 워커의 키(서명 키 · 어테스터 계정)는 이미 Cloudflare 에
# Secret 으로 들어 있어 배포에는 필요 없다 — 여기서 쓰는 것은 배포 권한 토큰뿐이다.
#
# 필요한 것 (처음 한 번): 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN   Cloudflare › My Profile › API Tokens › "Edit Cloudflare Workers" 템플릿
#   토큰은 워커가 도는 계정(stepup-attester.gana003.workers.dev 의 계정)에서 만든다. 다른 계정 토큰이면
#   배포하지 않고 멈춘다 — 그 계정에는 워커의 키가 없다.
# 비밀이 없으면 건너뛰기만 하고 실패하지 않는다.
name: Deploy attester

on:
  push:
    branches:
      - "main"
    paths:
      - "attester/**"
      - ".github/workflows/deploy-attester.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # 워커가 도는 Cloudflare 계정의 workers.dev 이름 (stepup-attester.<이 이름>.workers.dev)
  WORKER_SUBDOMAIN: gana003

concurrency:
  group: deploy-attester
  cancel-in-progress: false

jobs:
  deploy:
    # 손으로 돌려도 main 의 것만 올린다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attester
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: attester/package-lock.json

      - name: Install
        run: npm ci

      # 올리기 전에 한 번 더 — 서명 재료 · 요청 처리 검사가 깨졌으면 올리지 않는다
      - name: Test
        run: npm test

      - name: 배포 토큰이 있는지
        id: keys
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN 이 없어 배포를 건너뜁니다. attester 에서 npm run deploy 를 직접 돌리세요."
          fi

      # 토큰이 살아 있는지, 어떤 권한 · 계정을 보는지 — 배포가 거절될 때 원인을 바로 알 수 있게.
      # (토큰 값은 찍지 않는다. 계정 ID · 권한 이름만 나온다.)
      - name: 토큰 확인
        if: steps.keys.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | jq '{success, status: .result.status}' || true
          npx wrangler whoami || true

      - name: Cloudflare 에 배포
        if: steps.keys.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # 커밋을 워커 변수로 넣어 /health 에서 새 코드가 떴는지 확인한다(비밀이 아니다)
        # 워커가 도는 계정(WORKER_SUBDOMAIN)을 찾아 그 계정으로만 올린다 — 다른 계정 토큰이면 멈춘다(scripts/deploy.mjs)
        run: npm run deploy -- --var "COMMIT_SHA:${GITHUB_SHA}"

      # 새 코드가 떴는지 — /health 가 응답하고 긴급 정지 키가 있는지
      - name: 확인
        if: steps.keys.outputs.ready == 'yes'
        run: |
          # 새 버전이 퍼지는 데 잠깐 걸린다 — 몇 번 다시 본다
          for i in 1 2 3 4 5 6; do
            sleep 10
            body=$(curl -fsS https://stepup-attester.${WORKER_SUBDOMAIN}.workers.dev/health || true)
            echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\"" && break
          done
          echo "$body"
          echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\"" || { echo "::error::새 버전(${GITHUB_SHA})이 아직 뜨지 않았습니다"; exit 1; }
          echo "$body" | grep -q '"canPause":true' || { echo "::error::긴급 정지 키(GUARDIAN_PRIVATE_KEY)가 없습니다"; exit 1; }
