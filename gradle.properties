# Project-wide Gradle settings.
# 한 번에 단위 검사 · lint · R8 릴리스 · APK 세 개를 묶는 CI 단계가 2GB 에서 패키징 중 힙이 모자랐다
# (PR #32 Experience QA 36242715223, java.lang.OutOfMemoryError: Java heap space).
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Kotlin 컴파일 데몬은 따로 힙을 준다 — 지정하지 않으면 위 3GB 를 물려받는데, 같은 CI 단계에서 디버그 · 릴리스 컴파일이
# 한 데몬에서 함께 돌다가 큰 러닝 화면(WalkScreen.kt)의 IR 변환 중 힙이 모자랐다(PR #79 Experience QA 37066197998).
kotlin.daemon.jvmargs=-Xmx5120m -Dfile.encoding=UTF-8
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project
kotlin.code.style=official
# Only keep the R class for the module with resources
android.nonTransitiveRClass=true
