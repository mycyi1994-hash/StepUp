<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03060D">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 — StepUp</title>
<link rel="icon" href="/assets/img/app-icon-192.webp" type="image/webp">
<!-- 없는 주소 — Cloudflare Pages 가 404 상태로 이 파일을 준다. 예전엔 홈페이지를 그 주소 그대로 보여, 상대 경로
     (./styles.css)가 /foo/styles.css 로 풀려 글자만 남은 깨진 화면이 됐다. 그래서 여기는 모두 / 로 시작하는 주소를 쓴다. -->
<style>
@font-face{font-family:Pretendard;src:url('/assets/fonts/pretendard-regular.subset.woff2') format('woff2');font-weight:400 600;font-display:swap}
@font-face{font-family:Pretendard;src:url('/assets/fonts/pretendard-extrabold.subset.woff2') format('woff2');font-weight:700 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03060D;color:#F4F8FF;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:min(100%,440px);display:flex;flex-direction:column;gap:18px}
img{width:132px;height:auto}
h1{margin:12px 0 0;font-size:28px;line-height:1.3;letter-spacing:-.04em;word-break:keep-all}
p{margin:0;color:#A8BDD9;font-size:15px;line-height:1.7;word-break:keep-all}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
a.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border-radius:999px;font-weight:800;text-decoration:none}
.primary{background:#147BFF;color:#fff}
.secondary{border:1px solid #1A3B61;color:#DDE6F4}
.en{margin-top:18px;padding-top:18px;border-top:1px solid #13284A}
</style>
</head>
<body>
<main>
  <a href="/"><img src="/assets/img/stepup-logo.webp" width="916" height="172" alt="StepUp"></a>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 없는 페이지예요. 홈페이지에서 StepUp을 둘러보거나 출시 소식을 받아보세요.</p>
  <div class="actions">
    <a class="button primary" href="/#join">사전 등록하기</a>
    <a class="button secondary" href="/">홈페이지로</a>
  </div>
  <p class="en" lang="en">This page does not exist. Go to the <a href="/?lang=en" style="color:#4C9DFF">StepUp homepage</a> or <a href="/?lang=en#join" style="color:#4C9DFF">join the waitlist</a>.</p>
</main>
</body>
</html>
