<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>STEPUP · 미스터리 박스</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080f20; color: #f7f9ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, #173c7d 0, #0c1936 38%, #080f20 78%); }
    main { width: min(100%, 460px); min-height: 100vh; margin: auto; padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }
    .brand { align-self: start; width: 114px; height: auto; }
    h1 { font-size: 28px; margin: 34px 0 8px; text-align: center; }
    .sub { color: #b9c8e7; text-align: center; margin: 0; line-height: 1.5; }
    .art { flex: 1; min-height: 240px; max-height: 440px; width: 100%; display: grid; place-items: center; }
    .art img { width: min(100%, 340px); max-height: 100%; object-fit: contain; filter: drop-shadow(0 18px 36px #005eff77); }
    .actions { width: 100%; display: grid; gap: 10px; }
    button { width: 100%; min-height: 54px; border: 0; border-radius: 28px; font: 700 16px system-ui, sans-serif; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .primary { background: linear-gradient(100deg, #2067ff, #4fc8ff); color: white; }
    .secondary { background: #162947; border: 1px solid #4877b7; color: #e5efff; }
    #status { color: #b9c8e7; text-align: center; min-height: 3em; line-height: 1.5; margin: 18px 0 0; }
    #result { width: 100%; border: 1px solid #468bf5; border-radius: 16px; background: #102442; padding: 16px; margin-top: 14px; line-height: 1.55; }
    #result[hidden] { display: none; }
    a { color: #89caff; }
    @media (prefers-reduced-motion: no-preference) { .art img { animation: breathe 3.5s ease-in-out infinite alternate; } @keyframes breathe { to { transform: scale(1.025); } } }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="assets/stepup-logo-on-navy.webp" alt="STEPUP">
    <h1>미스터리 박스</h1>
    <p class="sub">신발 또는 트레이닝복을 선택하세요.</p>
    <div class="art"><img src="assets/mystery-box-closed.webp" alt="푸른빛이 나는 미스터리 박스"></div>
    <div class="actions">
      <button id="shoe" class="primary" type="button">신발 뽑기</button>
      <button id="outfit" class="secondary" type="button">트레이닝복 뽑기</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="result" hidden role="status" aria-live="polite"></div>
  </main>
  <script src="draw-config.js"></script>
  <script type="module" src="assets/draw.js"></script>
</body>
</html>
