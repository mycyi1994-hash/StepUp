<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>워킹데이 인증 검토 | StepUp</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{--choc:#241006;--ink:#2A1206;--milk:#7E4D2B;--wcho:#F6E6CB;--cream:#F8EBD3;--line:#E2CBA6;--blue:#1760D6;--red:#BE2316;--green:#1F7A3A}
*{box-sizing:border-box}
body{margin:0;background:var(--wcho);color:var(--ink);font-family:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.45;word-break:keep-all}
header{background:var(--choc);color:var(--cream);padding:14px 16px}
header .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#EDCC99}
.stats b{color:var(--cream);font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.auto{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--cream);border-left:4px solid var(--blue);color:var(--ink);font-size:13px;line-height:1.5}
.tabs button{height:40px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--cream);font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--choc);border-color:var(--choc);color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{background:var(--cream);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.item img{width:100%;max-height:440px;object-fit:contain;background:#fff;border-radius:8px;cursor:zoom-in}
.meta{font-size:14px}
.meta b{font-size:16px}
.warn{color:var(--red);font-weight:700;font-size:13px}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1;min-width:0;height:42px;border:2px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:16px}
.act{display:flex;gap:6px}
.act button,.btn{flex:1;height:44px;border:0;border-radius:10px;font:inherit;font-weight:700;color:#fff;cursor:pointer}
.ok{background:var(--green)}.no{background:var(--red)}.re{background:var(--milk)}.btn{background:var(--blue);padding:0 16px;flex:none}
button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--milk)}
.gate{max-width:420px;margin:40px auto;background:var(--cream);border-radius:16px;padding:20px}
.gate input{width:100%;height:48px;border:2px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin:8px 0 12px}
.gate .btn{width:100%}
.err{color:var(--red);font-weight:600;min-height:1.2em}
.empty{padding:30px;text-align:center;color:var(--milk)}
.more{display:block;margin:16px auto 0}
table{width:100%;border-collapse:collapse;background:var(--cream);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.zoom img{max-width:96vw;max-height:96vh}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="in"><h1>11.11 워킹데이 · 인증 검토</h1><div class="stats" id="stats"></div></div></header>
<main>
  <form class="gate" id="gate">
    <label for="key"><b>검토 키</b></label>
    <input id="key" type="password" autocomplete="off" placeholder="운영자에게 받은 키">
    <p class="err" id="gateErr"></p>
    <button class="btn" type="submit">열기</button>
  </form>
  <section id="app" hidden>
    <p class="auto">자동 승인 켜짐 · 들어오는 걸음 인증 · SNS 게시물은 바로 「승인」돼요(확인자 「자동」). 「승인」 · 「SNS 승인」 탭에서 이상한 것만 거절하세요. 거절한 날을 다시 내면 「대기」로 와요.</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="pending" aria-selected="true">대기</button>
      <button type="button" role="tab" data-tab="approved" aria-selected="false">승인</button>
      <button type="button" role="tab" data-tab="rejected" aria-selected="false">거절</button>
      <button type="button" role="tab" data-tab="entries" aria-selected="false">응모권 명단</button>
      <button type="button" role="tab" data-tab="sns_pending" aria-selected="false">SNS 대기</button>
      <button type="button" role="tab" data-tab="sns_approved" aria-selected="false">SNS 승인</button>
      <button type="button" role="tab" data-tab="sns_rejected" aria-selected="false">SNS 거절</button>
      <button type="button" role="tab" data-tab="sns_roster" aria-selected="false">SNS 명단(추첨기)</button>
    </div>
    <div id="list"></div>
  </section>
</main>
<div class="zoom" id="zoom" hidden><img alt="캡처 크게 보기"></div>
<script src="/11events/assets/config.js"></script>
<script src="/11events/review.js?v=1107b"></script>
</body>
</html>
