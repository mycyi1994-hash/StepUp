<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>STEPUP · 지갑</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080f20; color: #f7f9ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #173c7d 0, #0c1936 40%, #080f20 80%); }
    main { width: min(100%, 520px); margin: auto; padding: max(24px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
    .brand { width: 114px; height: auto; }
    h1 { font-size: 26px; margin: 22px 0 16px; }
    .card { background: #0f213f; border: 1px solid #25406b; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size: 17px; margin: 0 0 8px; }
    p { color: #c7d4ee; line-height: 1.55; margin: 6px 0 12px; }
    .note { color: #9fb2d6; font-size: 14px; }
    .mono { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; color: #e5efff; }
    button { min-height: 48px; border: 0; border-radius: 24px; padding: 0 20px; font: 700 15px system-ui, sans-serif; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .primary { width: 100%; background: linear-gradient(100deg, #2067ff, #4fc8ff); color: #fff; min-height: 54px; font-size: 16px; }
    .secondary { background: #162947; border: 1px solid #4877b7; color: #e5efff; }
    .small { min-height: 48px; padding: 0 14px; font-size: 14px; } /* 누르는 칸은 48px 아래로 줄이지 않는다 */
    input { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid #36568a; background: #0a1730; color: #fff; padding: 0 14px; font-size: 16px; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; align-items: flex-start; }
    .row input { flex: 1; }
    .list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; }
    .list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #0a1730; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .qr { width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 8px; display: block; margin: 8px auto 12px; }
    #status { color: #cfe0ff; min-height: 1.5em; line-height: 1.5; margin: 4px 0 16px; }
    a { color: #89caff; }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="assets/stepup-logo-on-navy.webp" alt="STEPUP">
    <h1>지갑</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="app"><section class="card"><p>불러오는 중…</p></section></div>
  </main>
  <script src="wallet-config.js"></script>
  <script type="module" src="assets/wallet.js"></script>
</body>
</html>
