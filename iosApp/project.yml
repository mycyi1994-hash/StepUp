# XcodeGen 설정 — StepUp.xcodeproj 는 이 파일에서 만들고 저장소에 넣지 않는다.
#   brew install xcodegen
#   cd iosApp && xcodegen generate && open StepUp.xcodeproj
# Kotlin 화면(:sharedUi → StepUpKit 틀)은 빌드 첫 단계에서 Gradle 이 만든다(JDK 17 이 PATH 에 있어야 한다). docs/ios/README.md
name: StepUp
options:
  bundleIdPrefix: com.stepupcrew
  developmentLanguage: ko
  deploymentTarget:
    iOS: "16.0"
# 구글 로그인 iOS SDK(Swift 패키지) — Apple 로그인은 시스템(AuthenticationServices)
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
targets:
  StepUp:
    type: application
    platform: iOS
    sources:
      - path: StepUp
    dependencies:
      - package: GoogleSignIn
    # Apple 로그인(심사 4.8 — 구글 로그인을 두면 함께 있어야 한다). 실기기 · TestFlight 는 App ID 에 같은 기능을 켠다
    entitlements:
      path: StepUp/StepUp.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_NAME: StepUp
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        DEVELOPMENT_TEAM: $(TEAM_ID)
        INFOPLIST_FILE: StepUp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 아이폰만(아이패드 스크린샷 · 화면을 따로 만들지 않는다 — docs/APP-STORE.md)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Gradle 스크립트가 저장소의 다른 폴더를 읽고 쓴다
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../sharedUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework StepUpKit
    preBuildScripts:
      - name: Build StepUpKit (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :sharedUi:embedAndSignAppleFrameworkForXcode
schemes:
  StepUp:
    build:
      targets:
        StepUp: all
    run:
      config: Debug
    archive:
      config: Release
